# GH Actions release workflow — JHYY installer (v1.5.5+)
#
# Triggers:
#   1. push tag matching `v*` (e.g. v1.5.5, v1.5.5-rc1)
#   2. workflow_dispatch (manual; for dry-run / RC validation without tag push)
#
# Per-sprint scope (v1.5.5):
#   - Build jhyy.exe from src0 via stage-0 chain (make stage0 + make)
#   - Run gated regress (must pass; release gate)
#   - Build Burn bundle + MSI + VSCode ext via installer/build.ps1
#   - Generate SHA256.txt + release notes (from changelog-template.md)
#   - Upload 4 assets + create GitHub Release
#
# Out of scope (per plan):
#   - Code signing (Authenticode) — deferred to v2.x
#   - Cross-platform installer (Linux/macOS) — deferred to v2.x
#   - Multi-Windows-version matrix — single windows-latest runner
#
# Why windows-latest + MSYS2: matches ci.yml + local dev env. Both must
# produce the same binary SHA; release workflow re-runs regress baseline.
#
# qbe.exe source: vendored copy of QBE compiler source under qbe/. Built by
# the "Build qbe.exe" step below. Historical gitlink was dangling (no
# .gitmodules) — see W-025 for the v1.5.5 vendoring fix.
#
# Reference: docs/plans/v1/v1.5.0任务清单 + 概要设计.md § Sprint v1.5.5
name: JHYY Installer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.5, 1.5.5-rc1)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run (skip upload + release creation)'
        type: boolean
        default: false

# Release builds cannot be cancelled mid-flight (assets would be partial).
# concurrency cancel-in-progress: false ensures a tag push waits for prior runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create Release

jobs:
  build-and-release:
    name: Build installer + create GitHub Release
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # IS_RC: '1' if version contains '-rc' suffix
      # (computed in the prep step below; this default is for display only)
      IS_RC: '0'

    steps:
      - name: Compute VERSION + IS_RC + JHY_TAG_NAME
        shell: pwsh
        run: |
          # Determine VERSION: prefer workflow_dispatch input, else strip 'v' from tag ref.
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:VERSION = "${{ inputs.version }}"
          } else {
            # push tag: github.ref_name like "v1.5.5-rc1" -> "1.5.5-rc1"
            $env:VERSION = "${{ github.ref_name }}" -replace '^v', ''
          }
          $env:JHY_IS_RC = ($env:VERSION -match '-rc') ? '1' : '0'
          $env:JHY_TAG_NAME = "v$($env:VERSION)"
          Write-Host "VERSION=$($env:VERSION)"
          Write-Host "JHY_IS_RC=$($env:JHY_IS_RC)"
          Write-Host "JHY_TAG_NAME=$($env:JHY_TAG_NAME)"
          "VERSION=$($env:VERSION)"           | Add-Content -Path $env:GITHUB_ENV
          "JHY_VERSION=$($env:VERSION)"      | Add-Content -Path $env:GITHUB_ENV
          "JHY_IS_RC=$($env:JHY_IS_RC)"      | Add-Content -Path $env:GITHUB_ENV
          "JHY_TAG_NAME=$($env:JHY_TAG_NAME)"| Add-Content -Path $env:GITHUB_ENV

      - name: Compute JHY_VERSION_DISPLAY (mirror build.ps1 strip-to-3 logic)
        shell: pwsh
        run: |
          # v1.8.3.3 fix: release.yml used $VERSION directly in artifact paths, but
          # installer/build.ps1 strips 4-segment VERSION down to 3 segments for
          # MSI ProductVersion constraint (e.g. 1.8.3.3 -> 1.8.3). Artifact files
          # use the stripped version in their filenames, so release.yml must
          # reference JHY_VERSION_DISPLAY not VERSION. Without this, validate +
          # upload steps look for jhyy-compiler-1.8.3.3.msi which never exists.
          # See installer/build.ps1:75-83 for the canonical strip logic — kept
          # in sync here so the workflow doesn't drift from build.ps1 again.
          $verIn = $env:VERSION -replace '^v', ''
          $parts = $verIn.Split('.')
          if ($parts.Length -ge 3) {
            $env:JHY_VERSION_DISPLAY = "$($parts[0]).$($parts[1]).$($parts[2])"
          } else {
            $env:JHY_VERSION_DISPLAY = $verIn
          }
          # Re-attach RC suffix if present (e.g. 1.5.5-rc1 → display 1.5.5-rc1)
          if ($env:VERSION -match '-rc') {
            $rcSuffix = ($env:VERSION -split '-rc')[1]
            if ($rcSuffix) {
              $env:JHY_VERSION_DISPLAY = "$($env:JHY_VERSION_DISPLAY)-rc$rcSuffix"
            }
          }
          Write-Host "JHY_VERSION_DISPLAY=$($env:JHY_VERSION_DISPLAY)"
          "JHY_VERSION_DISPLAY=$($env:JHY_VERSION_DISPLAY)" | Add-Content -Path $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # qbe/ is a vendored copy of the QBE compiler source (v1.5.5 vendoring
          # fix for the historical dangling gitlink). See W-025.
          fetch-depth: 0  # for git describe / tag detection

      - name: Setup MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            python
            python-pip
            zip

      - name: Setup .NET 8 (WiX 4/7 prerequisite)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install WiX 4/7 toolchain
        shell: pwsh
        run: |
          # WiX CLI ships as a .NET tool; install globally and add to PATH.
          # Use Add-Content (per W-022) — Out-File -Encoding utf8 corrupts
          # $GITHUB_PATH with UTF-8 BOM.
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Add-Content -Path $env:GITHUB_PATH
          # WiX 7+ requires explicit OSMF EULA acceptance (WIX7015). The
          # `wix eula accept wix7` command writes a sentinel file to
          # $USERPROFILE that subsequent `wix` invocations honor; alternative
          # is `-acceptEula wix7` on every invocation (verbose). See
          # https://github.com/wixtoolset/issues/issues/9196.
          wix eula accept wix7
          wix --version
          wix extension add -g WixToolset.Util.wixext
          wix extension add -g WixToolset.UI.wixext
          wix extension add -g WixToolset.Bal.wixext

      - name: Install vsce (VSCode Extension CLI)
        shell: pwsh
        run: |
          # vsce is used by installer/build.ps1 to package the VSCode
          # extension as a .vsix for the installer bundle. Required for
          # v1.5.4+ release workflow (prior runs locally had vsce, but
          # CI runner doesn't include it by default).
          npm install -g @vscode/vsce
          vsce --version

      - name: Build qbe.exe (vendored source under qbe/)
        shell: msys2 {0}
        run: |
          # W-025: qbe/ was historically a dangling gitlink; v1.5.5 vendored
          # the Windows-fork source (with amd64/winabi.c etc.) directly into
          # the repo. Build qbe.exe from vendored source.
          cd qbe
          make
          ls -la qbe.exe
          sha256sum qbe.exe
          cd ..

      - name: Build stage 0 (C-side bootstrap)
        shell: msys2 {0}
        run: |
          make stage0

      - name: Build jhyy.exe (jhyy-side production via stage 0)
        shell: msys2 {0}
        run: |
          make
          sha256sum compiler/build/bin/jhyy.exe
          ls -la compiler/build/bin/jhyy.exe

      - name: Run regress (gated — must PASS)
        shell: msys2 {0}
        run: |
          # v1.5.6: W-027 RESOLVED — jhyy.exe 自己探测 gcc 路径 (4-tier via
          # jh_gcc_path()), regress.py 不再需要 prepend MSYS2 bin 到 PATH.
          # 之前 "Propagate MSYS2 paths" step 已删 (W-029 superseder).
          # W-028 保留 ACTIVE: Windows process exit code 8-bit, compare mod 256.
          # Sanity: compile one .jhyy directly to verify jhyy.exe works
          echo "=== Sanity: compile arith.jhyy directly ==="
          compiler/build/bin/jhyy.exe compile compiler/tests/examples/arith.jhyy -o /tmp/sanity_arith.exe 2>&1 | tail -20
          echo "Sanity exit: $?"
          ls -la /tmp/sanity_arith.exe 2>&1 || echo "no exe created"
          echo "=== End sanity ==="
          echo ""
          JHYY_DEBUG_W028=1 python compiler/build/bin/regress.py --all
          # exit code 0 = pass; non-zero = fail (will block release)

      - name: Build installer (Burn bundle + MSI + .vsix)
        shell: pwsh
        env:
          JHY_VERSION: ${{ env.VERSION }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 bundle
          # Use pwsh (PowerShell 7+) to match step shell — Windows PowerShell 5.1
          # in some runner images mis-parses switch ($Target) { "bundle" { ... } }
          # block syntax (failure mode: "Unexpected token '{'" + "Missing statement
          # block in switch statement clause"). build.ps1 also runs successfully
          # locally on PowerShell 5.1 + 7.

      - name: Verify SHA256.txt content
        shell: pwsh
        run: |
          Get-Content installer/SHA256.txt
          Write-Host ""
          Write-Host "Expected files:"
          foreach ($f in @(
            "installer/build-artifacts/jhyy-installer-$env:JHY_VERSION_DISPLAY.exe",
            "installer/build-artifacts/jhyy-compiler-$env:JHY_VERSION_DISPLAY.msi",
            "installer/build-artifacts/jhyy-lang-$env:JHY_VERSION_DISPLAY.vsix"
          )) {
            if (Test-Path $f) {
              $info = Get-Item $f
              Write-Host "  $($info.Name) ($($info.Length) bytes)"
            } else {
              Write-Host "  [MISSING] $f"
            }
          }

      - name: Generate release notes from template
        shell: pwsh
        run: |
          $template = Get-Content installer/changelog-template.md -Raw
          $isoDate = (Get-Date -Format "yyyy-MM-dd")
          # Tag path uses VERSION (e.g. v1.8.3.3); filename uses JHY_VERSION_DISPLAY
          # (e.g. jhyy-installer-1.8.3.exe) because installer/build.ps1 strips 4-segment
          # VERSION down to 3 segments for MSI ProductVersion constraint.
          $installerUrl = "https://github.com/JiHuiYiYou/JiHuiYiYou-compiler/releases/download/v$($env:VERSION)/jhyy-installer-$($env:JHY_VERSION_DISPLAY).exe"
          $sha256Url = "https://github.com/JiHuiYiYou/JiHuiYiYou-compiler/releases/download/v$($env:VERSION)/SHA256.txt"
          $minor = ($env:VERSION -split '\.')[0..1] -join '.'
          $notes = $template `
            -replace '\$\{VERSION\}', $env:VERSION `
            -replace '\$\{ISO_DATE\}', $isoDate `
            -replace '\$\{INSTALLER_URL\}', $installerUrl `
            -replace '\$\{SHA256_URL\}', $sha256Url `
            -replace '\$\{MINOR\}', $minor
          Set-Content -Path release-notes.md -Value $notes -NoNewline
          Write-Host "[OK] release-notes.md written"
          Get-Content release-notes.md | Select-Object -First 30

      - name: Validate MSI (wix msi validate)
        shell: pwsh
        run: |
          wix msi validate installer/build-artifacts/jhyy-compiler-$($env:JHY_VERSION_DISPLAY).msi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERROR] MSI validation failed (ICE errors found)"
            exit 1
          }
          Write-Host "[OK] MSI validation passed (0 ICE errors)"

      - name: Confirm artifacts present (dry-run gate)
        if: inputs.dry_run == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          foreach ($f in @(
            "installer/build-artifacts/jhyy-installer-$($env:JHY_VERSION_DISPLAY).exe",
            "installer/build-artifacts/jhyy-compiler-$($env:JHY_VERSION_DISPLAY).msi",
            "installer/build-artifacts/jhyy-lang-$($env:JHY_VERSION_DISPLAY).vsix",
            "installer/SHA256.txt",
            "release-notes.md"
          )) {
            if (-not (Test-Path $f)) {
              Write-Host "[ERROR] missing artifact: $f"
              exit 1
            }
          }
          Write-Host "[OK] all 5 artifacts present"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.JHY_TAG_NAME }}
          name: 'JHYY ${{ env.VERSION }}${{ env.JHY_IS_RC == ''1'' && '' [RC]'' || '''' }}'
          body_path: release-notes.md
          draft: false
          prerelease: ${{ env.JHY_IS_RC == '1' }}
          make_latest: ${{ env.JHY_IS_RC != '1' }}
          fail_on_unmatched_files: true
          files: |
            installer/build-artifacts/jhyy-installer-${{ env.JHY_VERSION_DISPLAY }}.exe
            installer/build-artifacts/jhyy-compiler-${{ env.JHY_VERSION_DISPLAY }}.msi
            installer/build-artifacts/jhyy-lang-${{ env.JHY_VERSION_DISPLAY }}.vsix
            installer/SHA256.txt
          # GITHUB_TOKEN auto-provided; no extra secrets needed.

      - name: Dry-run summary
        if: inputs.dry_run == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "DRY RUN — nothing uploaded, no Release created"
          Write-Host "VERSION=$($env:VERSION) DISPLAY=$($env:JHY_VERSION_DISPLAY) TAG=$($env:JHY_TAG_NAME) IS_RC=$($env:JHY_IS_RC)"
          Write-Host "Built artifacts:"
          foreach ($f in Get-ChildItem installer/build-artifacts/*.{exe,msi,vsix} | Where-Object { $_.Name -match $env:JHY_VERSION_DISPLAY }) {
            Write-Host "  $($f.Name) ($($f.Length) bytes)"
          }
          Write-Host "SHA256 (for this VERSION):"
          Get-Content installer/SHA256.txt | Where-Object { $_ -match $env:JHY_VERSION_DISPLAY }
          Write-Host "============================================="