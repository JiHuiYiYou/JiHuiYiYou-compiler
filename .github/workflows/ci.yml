# GH Actions CI — JHYY compiler v1.4.7+ (2026-08-14 ship)
#
# v1.4.7 单 regress 入口 + matrix 守门 (取代 v1.4.5 三跑 shim):
#   1. python regress.py --all                            (gated: jhyy.exe + jhyy_stage0.exe)
#   2. python regress.py --all --include-informational    (matrix only: jhyy_v1.exe.exe historical)
#   3. make selfhost                                       (Stage 2 N=3 byte-equal closure)
#
# 触发面:
#   - push to main (含 v1.x ‖ v2.x ‖ v3.x 任何 commit)
#   - PR to main
#
# Windows runner (windows-latest) — 跟开发机一致 (Windows 10 + MSYS2 bash +
# gcc + QBE + runtime)。其他 OS 留给未来扩展 (per `docs/plans/v2/v2.0.0-os-prep.md`
# amd64_sysv target 之后)。
#
# 守门:
#   - gated binary 全 PASS → CI pass
#   - 任一 gated fail → CI fail (block merge)
#   - informational fail → log only, 不 block PR (matrix row)
#
# 不做 (per `feedback_auto_push_after_commit.md`):
#   - 不自动 push / tag — 保留人工 review

name: JHYY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: 同一 ref 新 push 自动 cancel 在跑的 run, 节省 CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            python
            python-pip

      - name: Set bash as default shell
        shell: msys2 {0}
        run: |
          echo "GH_RUNNER=true" >> $GITHUB_ENV
          echo "MSYS2_PATH=/c/msys64/usr/bin:$PATH" >> $GITHUB_ENV
          which gcc python make

      - name: Build stage 0 (C-side bootstrap)
        shell: msys2 {0}
        run: |
          make stage0

      - name: Build stage 1 (jhyy-side production via stage 0)
        shell: msys2 {0}
        run: |
          make

      - name: "Run regress.py --all (gated: jhyy.exe + jhyy_stage0.exe)"
        shell: msys2 {0}
        run: |
          # v4.0.2 W-073 follow-on GHA gate fix: regress.py lives at project root
          # (regress.py, not compiler/build/bin/regress.py — it was relocated
          # in v4.0.0-rc1 to keep the build/ tree artifact-only). Historical
          # `python compiler/build/bin/regress.py` failed with FileNotFoundError.
          python regress.py --all

      - name: Run regress.py --all --include-informational (v1 historical baseline, matrix only)
        shell: msys2 {0}
        continue-on-error: true
        run: |
          # v4.0.8:jhyy_v1.exe.exe = jhyy.exe 的副本,由 `make` 每次构建生成,
          # 不再是 git 里的静态快照。它唯一的作用是给 fixed_point/byte_equal 当
          # 「第 0 代」,使 v1==v2 成为一条真正的**确定性检查**(同一二进制跑
          # 两遍必须产出相同 .il/.s)。
          # 本 step 跑的是默认 binary(jhyy.exe)带 --include-informational,
          # 与 v1 无关;保留 informational + continue-on-error 语义不变。
          python regress.py --all --include-informational

      - name: Build Stage 2 closure chain (v1→v2→v3→v4)
        shell: msys2 {0}
        run: |
          make selfhost

      - name: Stage 2 N=3 byte-equal (closure chain)
        shell: msys2 {0}
        run: |
          # 手动跑 closure chain (跟 jhyy_selfhost_check MCP 等价但纯 bash)
          # v1 → v2 → v3 → v4 .il sha 必须全相同
          # 命名规则 (per `feedback_regress_baseline_binary_hash.md`):
          #   jhyy_v1.exe.exe = v1 (jhyy.exe copy, tracked — v1.4.4+ 副本约定)
          #   jhyy_v2/3/4.exe = 当前 closure product (每次 make selfhost 重 build)
          set -e
          SHA_V1=""
          SHA_V2=""
          SHA_V3=""
          SHA_V4=""
          for stage in v1 v2 v3 v4; do
            if [ "$stage" = "v1" ]; then
              BIN="compiler/build/bin/jhyy_v1.exe.exe"
            else
              BIN="compiler/build/bin/jhyy_${stage}.exe"
            fi
            if [ ! -x "$BIN" ]; then
              echo "FAIL: $BIN not found — run \`make selfhost\` first"
              exit 1
            fi
            $BIN compile compiler/src0/main.jhyy -o /tmp/closure_${stage}.exe >/dev/null 2>&1 || {
              echo "FAIL: ${BIN} cannot compile src0/main.jhyy"
              exit 1
            }
            SHA=$(sha256sum /tmp/closure_${stage}.exe.il | awk '{print $1}')
            case "$stage" in
              v1) SHA_V1="$SHA";;
              v2) SHA_V2="$SHA";;
              v3) SHA_V3="$SHA";;
              v4) SHA_V4="$SHA";;
            esac
            echo "  ${stage}.il sha: $SHA"
          done
          if [ "$SHA_V1" != "$SHA_V2" ] || [ "$SHA_V2" != "$SHA_V3" ] || [ "$SHA_V3" != "$SHA_V4" ]; then
            echo "FAIL: Stage 2 closure chain NOT byte-equal"
            echo "  v1=$SHA_V1 v2=$SHA_V2 v3=$SHA_V3 v4=$SHA_V4"
            exit 1
          fi
          echo "PASS: Stage 2 N=3 closure byte-equal (sha=$SHA_V1)"
