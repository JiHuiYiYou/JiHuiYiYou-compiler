# GH Actions CI — JHYY compiler v1.4.7+ (2026-08-14 ship)
#
# v1.4.7 单 regress 入口 + matrix 守门 (取代 v1.4.5 三跑 shim):
#   1. python regress.py --all                            (gated: jhyy.exe + jhyy_stage0.exe)
#   2. python regress.py --all --include-informational    (matrix only: jhyy_v1.exe.exe historical)
#   3. make selfhost                                       (Stage 2 N=3 byte-equal closure)
#
# 触发面:
#   - push to main (含 v1.x ‖ v2.x ‖ v3.x 任何 commit)
#   - PR to main
#
# Windows runner (windows-latest) — 跟开发机一致 (Windows 10 + MSYS2 bash +
# gcc + QBE + runtime)。其他 OS 留给未来扩展 (per `docs/plans/v2/v2.0.0-os-prep.md`
# amd64_sysv target 之后)。
#
# 守门:
#   - gated binary 全 PASS → CI pass
#   - 任一 gated fail → CI fail (block merge)
#   - informational fail → log only, 不 block PR (matrix row)
#
# 不做 (per `feedback_auto_push_after_commit.md`):
#   - 不自动 push / tag — 保留人工 review

name: JHYY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: 同一 ref 新 push 自动 cancel 在跑的 run, 节省 CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            python
            python-pip

      - name: Set bash as default shell
        shell: msys2 {0}
        run: |
          echo "GH_RUNNER=true" >> $GITHUB_ENV
          echo "MSYS2_PATH=/c/msys64/usr/bin:$PATH" >> $GITHUB_ENV
          which gcc python make

      - name: Build qbe.exe (vendored source under qbe/)
        shell: msys2 {0}
        run: |
          # W-025: MSYS2 has no qbe package; build from vendored source.
          # Same step as release.yml (see .github/workflows/release.yml).
          cd qbe
          make
          ls -la qbe.exe
          cd ..

      - name: Build stage 0 (C-side bootstrap)
        shell: msys2 {0}
        run: |
          set +e
          cd ${{ github.workspace }}
          echo "=== env probe ==="
          echo "PWD=$(pwd)"
          echo "msystem=$msystem"
          echo "PATH=$PATH"
          echo "--- which windres ---"
          which windres
          echo "--- ls ucrt64/bin/windres* ---"
          ls -la /c/msys64/ucrt64/bin/windres* 2>&1
          echo "--- ls usr/bin/windres* ---"
          ls -la /c/msys64/usr/bin/windres* 2>&1
          echo "--- pacman Q binutils ---"
          pacman -Q mingw-w64-ucrt-x86_64-binutils 2>&1
          echo "--- make stage0 ---"
          make stage0 2>&1
          echo "---FINAL_EXIT=$?---"

      - name: Build stage 1 (jhyy-side production via stage 0)
        shell: msys2 {0}
        run: |
          set +e
          cd ${{ github.workspace }}
          echo "--- ls build/bin ---"
          ls -la compiler/build/bin/ 2>&1
          echo "--- ls qbe ---"
          ls -la qbe/ 2>&1 | head -10
          echo "--- which gcc windres qbe ---"
          which gcc; which windres; which qbe
          echo "--- make all verbose ---"
          make 2>&1
          echo "---FINAL_EXIT=$?---"

      - name: "Run regress.py --all (gated: jhyy.exe + jhyy_stage0.exe)"
        shell: msys2 {0}
        run: |
          set +e
          cd ${{ github.workspace }}
          echo "--- ls binaries ---"
          ls -la compiler/build/bin/jhyy.exe compiler/build/bin/jhyy_stage0.exe compiler/build/bin/jhyy.exe.sha256 2>&1
          echo "--- python version ---"
          python --version 2>&1
          echo "--- python import test ---"
          python -c "import sys; sys.path.insert(0, 'mcp-jhyy'); from jhyy_regress import run_all; print('import OK')" 2>&1
          echo "--- regress.py --all (full output) ---"
          python compiler/build/bin/regress.py --all 2>&1 | head -50
          echo "---REGRESS_EXIT=$?---"

      - name: Run regress.py --all --include-informational (v1 historical baseline, matrix only)
        shell: msys2 {0}
        continue-on-error: true
        run: |
          cd ${{ github.workspace }}
          # jhyy_v1.exe.exe 在 v1.4.4+ 是 jhyy.exe 的副本 (per mcp-jhyy/jhyy_runner.py
          # copy 约定),v1 = 当前 jhyy-side production binary。closure chain 靠
          # .il sha 验证 byte-equal (不靠 binary sha),副本语义 OK。
          # 跟 v1.4.7 写注释时的原意 (v1 frozen historical baseline, v1.4.6 新 test
          # 必然 fail) 已脱节:v1 binary = 当前 production → 应该 PASS 所有当前 regress
          # test,不再是 expected-fail frozen baseline。该 step informational
          # (continue-on-error),v1 fail 不阻塞 PR,只作 matrix row。
          # v1.0.0 closure canonical (commit eabee0d) v1.4.4 后不再保留,原 TODO
          # "v1.5+ 恢复" moot。
          python compiler/build/bin/regress.py --all --include-informational

      - name: Build Stage 2 closure chain (v1→v2→v3→v4)
        shell: msys2 {0}
        run: |
          cd ${{ github.workspace }}
          make selfhost

      - name: Stage 2 N=3 byte-equal (closure chain)
        shell: msys2 {0}
        run: |
          cd ${{ github.workspace }}
          # 手动跑 closure chain (跟 jhyy_selfhost_check MCP 等价但纯 bash)
          # v1 → v2 → v3 → v4 .il sha 必须全相同
          # 命名规则 (per `feedback_regress_baseline_binary_hash.md`):
          #   jhyy_v1.exe.exe = v1 (jhyy.exe copy, tracked — v1.4.4+ 副本约定)
          #   jhyy_v2/3/4.exe = 当前 closure product (每次 make selfhost 重 build)
          set -e
          SHA_V1=""
          SHA_V2=""
          SHA_V3=""
          SHA_V4=""
          for stage in v1 v2 v3 v4; do
            if [ "$stage" = "v1" ]; then
              BIN="compiler/build/bin/jhyy_v1.exe.exe"
            else
              BIN="compiler/build/bin/jhyy_${stage}.exe"
            fi
            if [ ! -x "$BIN" ]; then
              echo "FAIL: $BIN not found — run \`make selfhost\` first"
              exit 1
            fi
            $BIN compile compiler/src0/main.jhyy -o /tmp/closure_${stage}.exe >/dev/null 2>&1 || {
              echo "FAIL: ${BIN} cannot compile src0/main.jhyy"
              exit 1
            }
            SHA=$(sha256sum /tmp/closure_${stage}.exe.il | awk '{print $1}')
            case "$stage" in
              v1) SHA_V1="$SHA";;
              v2) SHA_V2="$SHA";;
              v3) SHA_V3="$SHA";;
              v4) SHA_V4="$SHA";;
            esac
            echo "  ${stage}.il sha: $SHA"
          done
          if [ "$SHA_V1" != "$SHA_V2" ] || [ "$SHA_V2" != "$SHA_V3" ] || [ "$SHA_V3" != "$SHA_V4" ]; then
            echo "FAIL: Stage 2 closure chain NOT byte-equal"
            echo "  v1=$SHA_V1 v2=$SHA_V2 v3=$SHA_V3 v4=$SHA_V4"
            exit 1
          fi
          echo "PASS: Stage 2 N=3 closure byte-equal (sha=$SHA_V1)"
