# GH Actions CI — JHYY compiler
#
# 2026-10-18 重构:本文件的门表此前长期与实际脱节(列着已删的步骤、把一个
# 从不判定的 `make selfhost` 算成门)。下面这张表是**逐 step 对照实际配置**
# 写出来的,改动本文件时必须同步改它。
#
# | step                                   | 阻断?  | 验的是                                    |
# |----------------------------------------|--------|-------------------------------------------|
# | regress.py --all                       | ✅ 是  | 201 个测试的退出码/stdout 断言            |
# | 提交产物与当前源码同步(artifact-fresh)| ✅ 是  | 提交版与现编版编 src0 的 `.s` 逐字节相同  |
# | make selfhost                          | ✅ 是  | v2..v5 的 `.s` 逐字节相同(确定性+自洽)   |
# | closure_check.sh                       | ✅ 是  | Stage2 `.s` == Stage3 `.s`(自举闭环)      |
# | audit_test_assertions.py --strict      | ✅ 是  | 每个测试都有能失败的断言                   |
# | artifact_checks.sh                     | ✅ 是  | 产物字节布局(expected-FAIL 模型,见 step)  |
# | ~~jhyy_v1.exe.exe cmp 副本约定~~       | —     | 2026-10-18 删除,理由见下方 [已删 step]    |
#
# **每道门验的是什么边界,别互相误读:**
#   - regress / audit          = 正确性 + 断言强度
#   - artifact-fresh           = **提交产物对当前源码的行为一致性**。
#                                比 `.s` 不比 `.exe`(后者跨 toolchain 必假阳性)。
#                                ⚠️ 它看不见 codegen 中性的源码改动 —— 见该 step 注释
#   - make selfhost / closure  = 确定性 + 自洽。**不验正确性** —— 一个确定性的
#                                错误编译器照样闭环通过
#   - artifact_checks          = 那两条验不到的失效模式(症状在产物字节布局里,
#                                任何 .jhyy 测试都验不到)
#
# **所有门测的都是同一个二进制:本 job `make` 刚编出来的那份。** 这一条在
# 2026-10-18 之前是反的 —— regress 测的是 `git checkout HEAD --` 换回来的提交
# 产物,于是「改 src0 引入语义回归」这件事 201 个测试一个都不会红。挡着这层的
# 理由(W-117:CI 编出的编译器行为不同)已于同日闭合,理由不再成立。
#
# **「不验正确性」这句对 artifact_checks 同样适用**:它验的是「某个已知缺陷是否
#   仍以登记的方式存在」,不是「编译器是否正确」。
#
# **[已删 step] 2026-10-18**:`cmp jhyy.exe jhyy_v1.exe.exe` 那一步删掉了,两条理由:
#   1. 它**恒红**。上一步 `git checkout HEAD -- compiler/build/bin/jhyy.exe` 把
#      jhyy.exe 换回 git 版本,而副本是 make 从新编产物 cp 的,两者必然不同。
#      CI 日志每轮都打 `FAIL: 副本约定被破坏` 配 `continue-on-error: true` ——
#      恒红且被忽略的步骤 = 训练人忽略红色。
#   2. 就算不换回,它也**恒真**:`Makefile` 里那条规则字面就是 `cp -f $< $@`,
#      同一次 make 内不可能不同步。被保护者自己保证的不变量不需要门。
#   真正需要 v1 的是 fixed_point.sh / byte_equal.sh,那两个脚本内部本来就在
#   用它跑比对 —— 那里才是判据该在的地方。
#
# 触发面:
#   - push to main (含 v1.x ‖ v2.x ‖ v3.x 任何 commit)
#   - PR to main
#   - 手动 dispatch(此前只能 `gh run rerun` 重跑整轮,不能只重跑某个 job)
#
# **所有门测的都是本 job 刚编出来的 `jhyy.exe`**(2026-10-18 起)。此前 regress
# 测的是 `git checkout HEAD --` 换回来的提交产物,等于改 src0 的语义回归一个
# 测试都不会红。详见下面 build 步的注释与 workarounds.md 的 W-117 条目。
#
# Windows runner (windows-latest) — 跟开发机一致 (Windows 10 + MSYS2 bash +
# gcc + QBE + runtime)。其他 OS 留给未来扩展 (per `docs/plans/v2/v2.0.0-os-prep.md`
# amd64_sysv target 之后)。
#
# 不做 (per `feedback_auto_push_after_commit.md`):
#   - 不自动 push / tag — 保留人工 review

name: JHYY CI

on:
  push:
    branches: [main]
    # ⚠️ tags 必须**单独**列 —— `branches: [main]` 只匹配分支 ref
    # (`refs/heads/main`),不匹配 `refs/tags/*`。2026-10-18 实测:打完
    # v4.0.9-rc1 push 上去,**没有任何 run 被触发**,release job 里那个
    # `if: startsWith(github.ref, 'refs/tags/v')` 根本没机会求值。
    # 也就是说发布链在真 tag 上从来没被跑过 —— 正是这次要消灭的那类静默失效。
    # 注意:GitHub 的 push 过滤器里 branches 与 tags 是**或**关系,不是且。
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

# Concurrency: 同一 ref 新 push 自动 cancel 在跑的 run, 节省 CI minutes。
#
# 2026-10-18 收窄:`cancel-in-progress` 此前**无差别**作用在 push to main 上,
# 会把进行中的主干 run 砍掉一半。PR 上确实该取消(同一分支连续 push,前面的
# 结果已无意义),主干上是另一回事 —— 一次完整跑完的 main run 是发布前的凭据,
# 半途中被取消等于没跑。表达式按 event name 区分。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-latest
    # 30 → 45:本地实测一次全量 CI 流程(build stage0 + make + regress --all 两个
    # binary + regress --all --include-informational + make selfhost + closure_check)
    # 在 8 核机器上就要 ~15 分钟;GitHub runner 是 2 核且与自举编译的 fork/gcc
    # 争抢,30 分钟不够 —— 超时的 CI 跑一半被砍,比红的 CI 更糟(它既没通过也没
    # 告诉你哪一步没过)。宁可多花 minutes,不要半途而废。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            python
            python-pip

      - name: Set bash as default shell
        shell: msys2 {0}
        run: |
          echo "GH_RUNNER=true" >> $GITHUB_ENV
          echo "MSYS2_PATH=/c/msys64/usr/bin:$PATH" >> $GITHUB_ENV
          # v4.1.0: 把本 job 用的 MSYS2 根目录显式导出。GitHub runner 镜像
          # 自带一套旧 MSYS2 在 C:\mingw64(gcc 15.2.0),与 setup-msys2 装的
          # 新的一套(gcc 16.2.0)同时在 Windows PATH 上 ⇒ pwsh 步里按 PATH
          # 找 gcc 会挑中旧的 ⇒ 工具链版本 pin 失败。`/` 在 MSYS2 shell 里
          # 就是本 job 正在用的那套 ⇒ cygpath -w / 给出正解。
          echo "JHY_MSYS2_ROOT=$(cygpath -w /)" >> $GITHUB_ENV
          which gcc python make

      - name: Build jhyy.exe (self-bootstrap) — 回归门就测这个产物
        shell: msys2 {0}
        run: |
          # ── 工具链版本上报(刻意**不**钉版本)────────────────────────────
          # 为什么不上 `setup-msys2` 的 `update: false`:
          # **它换不来可复现性**。GitHub 的 `windows-latest` 本身是滚动镜像,
          # 每周更新、每次自带某个 MSYS2 状态;`update: false` 只是说「不在本次
          # job 内额外升级」,镜像照样漂。设了它会制造一个「已经可复现」的错觉,
          # 而错觉比不设更糟 —— 本次会话已经吃过一次这种亏(见 Makefile 里
          # STRICT_TOOLCHAIN 注释:它拿 `.exe` 跨 toolchain 比,报出来的漂移
          # 没有一条是真问题)。
          #
          # 真正要的是:**一条「因为工具链变了」而红的 CI 能立刻被归因**,
          # 而不是让人猜「是不是我们改坏了」。所以把四个版本写进 job summary ——
          # 它在 run 页面顶部,不用翻日志。
          {
            echo "### 工具链"
            echo ""
            echo "| 组件 | 版本 |"
            echo "|------|------|"
            echo "| gcc    | $(gcc --version 2>/dev/null | head -1) |"
            echo "| as     | $(as --version 2>/dev/null | head -1) |"
            echo "| ld     | $(ld --version 2>/dev/null | head -1) |"
            echo "| python | $(python --version 2>&1 | head -1) |"
            echo ""
            echo "runner 镜像是滚动的,工具链会随时间变化 —— 这是**已知且刻意接受**的。"
            echo "因此所有产物判定一律比 `.s`(源码 × 编译器的函数)而不是 `.exe`"
            echo "(源码 × 工具链版本的函数)。"
          } >> "$GITHUB_STEP_SUMMARY"

          # v4.0.8:`make` 用 jhyy.exe 自己编 src0,并做 byte-equal 自举闭环检查。
          #
          # STRICT_TOOLCHAIN=0 的理由(2026-10-18 修正措辞):它比的是 `.exe` 字节,
          # 而 `.exe` 是 (源码 × **工具链版本**) 的函数。同机同 toolchain 重建是
          # 逐字节可复现的(实测两次 `make` 同得 1eeb81b5),但 CI runner 的
          # gcc 16.2.0 / ld 2.47 与开发机的 15.2.0 / 2.45 必然产出不同字节 ——
          # 那不是漂移,是两个不同工具链的正常结果。该门对**发布者**有意义
          # (「我编出来的 == 我提交进仓的那份吗」),对 CI 没有意义。
          #
          # 2026-10-17 至 2026-10-18 之间这里曾把产物 `git checkout` 回提交那份,
          # 并打 warning 说「CI 编出的编译器行为与发布的不同(W-117)」。那句话是
          # **错的**:W-117 已于 2026-10-18 闭合(根因 = IL lexer 在 EOF 处无守卫,
          # `lex_peek_byte` 无 `cur < end` 边界检查 + `lex_next_byte` 在 EOF 不推进
          # cur),该症状在受控 A/B 下不复现 —— 见 docs/internal/workarounds.md。
          #
          # 现在:**不换回产物**。回归门测的就是本 job 刚编出来的这份,也就是
          # **当前源码**编出来的编译器。改 src0 引入的语义回归,201 个测试
          # 至少有一个会红 —— 这正是这道门存在的意义。
          make STRICT_TOOLCHAIN=0
          echo "本 job 编译出的 jhyy.exe: $(sha256sum compiler/build/bin/jhyy.exe | cut -d' ' -f1)"
          echo "后续所有门(regress / closure / artifact_checks)都测这一个二进制。"

      - name: 提交产物与当前源码同步(artifact-fresh)
        # ══════════════════════════════════════════════════════════════
        # 这道门守的是「**fresh clone 拿到的那份二进制**」——
        # `compiler/build/bin/jhyy.exe` 是 git 跟踪的 bootstrap 种子,
        # 绝大多数人 clone 下来拿到的就是它。
        #
        # 为什么需要:2026-10-18 第 3 期把 build 步里的
        # `git checkout HEAD -- compiler/build/bin/jhyy.exe` 删掉了 ——
        # 那一步有两个功能,第一个(让 regress 测陈旧产物)是缺陷,有意删;
        # 第二个(**让提交产物被读到**)是副作用,我没意识到就一起删了,
        # 随后又把提到它的那条 warning 也删了。于是这个问题从「答了一半」
        # 变成「完全没人答」:
        #
        #     改了 src0 但忘了重新提交 jhyy.exe → CI 全绿
        #     而 fresh clone 拿到的正是没更新的那份
        #
        # 比什么:比 **`.s`,不比 `.exe`**。`.s` 是 (源码 × 编译器) 的函数,
        # 与 host gcc 版本无关;`.exe` 是 (源码 × 工具链版本) 的函数,跨
        # toolchain 比必假阳性 —— W-117 那条 TOOLCHAIN-DRIFT 就是拿 `.exe`
        # 跨 toolchain 比出来的噪音。
        #
        # ⚠️ **这道门看不见什么(实测,别夸大它)**:
        # 它比的是「提交产物对当前源码的**行为**」,不是「提交产物的字节」。
        # 因此**任何 codegen 中性的源码改动它都看不见** —— 实测:
        #   W-117 修复前后那两个编译器编同一份 src0,产出逐字节相同
        #   (都是 dd3cc455)—— 因为那个修复(加 EOF 守卫)本身输出中性。
        # 行为相同意味着在链路上它们可互换,所以门判「绿」是对的;
        # 但新 clone 拿到的编译器确实比源码**旧**,带着那个已被修掉的隐患。
        # 对这一类,下面那条 git 层的 annotation 会点出来。
        shell: msys2 {0}
        run: |
          set -e
          AF=tmp/artifact_fresh
          rm -rf "$AF"; mkdir -p "$AF"
          BIN=compiler/build/bin/jhyy.exe
          SRC=compiler/src0/main.jhyy

          # 提交进仓那份(不是 make 刚编出来的)
          if ! git show "HEAD:$BIN" > "$AF/committed.exe" 2>/dev/null; then
            echo "::error::仓里没有 $BIN —— bootstrap 种子没了,fresh clone 无法自举"; exit 1
          fi
          chmod +x "$AF/committed.exe"
          echo "提交版 sha: $(sha256sum "$AF/committed.exe" | cut -c1-16)"
          echo "现编版 sha: $(sha256sum "$BIN" | cut -c1-16)"

          # 两者各自编 src0,比 .s。`! -s` 守卫是 W-086 那一类:编译器静默
          # exit 0 但不产 .s,那时 cmp 会因为文件缺失而给出误导性的「不同」。
          for who in committed fresh; do
            exe="$AF/committed.exe"; [ "$who" = fresh ] && exe="$BIN"
            if ! timeout 300 "$exe" compile "$SRC" --no-link -o "$AF/$who" > "$AF/$who.log" 2>&1; then
              echo "::error::$who 版编译器编 src0 失败(见 $AF/$who.log)"; tail -5 "$AF/$who.log"; exit 1
            fi
            if [ ! -s "$AF/$who.s" ]; then
              echo "::error::$who 版没产出 .s —— 门无法判定"; exit 1
            fi
            echo "  $who.s $(wc -c < "$AF/$who.s") B  sha $(sha256sum "$AF/$who.s" | cut -c1-16)"
          done

          if cmp -s "$AF/committed.s" "$AF/fresh.s"; then
            echo "  ✅ 提交产物对当前源码的行为与现编产物一致 —— fresh clone 的自举链是完整的"
          else
            echo "::error::提交产物与当前源码不同步 —— fresh clone 拿到的是落后的编译器"
            echo "::error::修法:make(同机同 toolchain 逐字节可复现)然后 git add $BIN"
            echo "--- 首个差异 ---"
            diff "$AF/committed.s" "$AF/fresh.s" | head -20 | sed 's/^/    /'
            exit 1
          fi

          # 这道门看不见的那一类:codegen 中性的 src0 改动。用 git 层的信息点出来,
          # **不阻断** —— 它只是一个「你可能忘了」提示,而唯一能确定判定的信号
          # (二进制 sha)在跨 toolchain 时是假阳性,不能拿来当门。
          #
          # 先确认 HEAD~1 存在:仓库的第一个 commit 没有父,`git diff HEAD~1 HEAD`
          # 会报错而非返回 0,不先判一下会在那种情况下误报。
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if ! git diff --quiet HEAD~1 HEAD -- compiler/src0/ \
               && git diff --quiet HEAD~1 HEAD -- "$BIN"; then
              echo "::warning title=src0 变了但二进制没跟着提交::本次 commit 改了 compiler/src0/ 却没改 $BIN。"
              echo "::warning::本门比的是行为;codegen 中性的改动(例如加一个边界守卫)它看不见 ——"
              echo "::warning::那种情况下新 clone 会拿到一个落后于源码的编译器。确认是否需要重新 make 并提交。"
            fi
          fi

      - name: "Run regress.py --all (gated: jhyy.exe)"
        shell: msys2 {0}
        run: |
          # v4.0.8:stage0 已从 gated 降为 informational —— 它是 C 端 bootstrap,
          # 语言子集早于 v3.x(闭包是 v3.2.1、char literal / Cap<T> 是 v3.x),
          # 实测有 39 个**预期内**的失败。让它 gate 等于派一个注定失败的活,
          # 结果只有「CI 永远红」或「有人放宽判据换绿」两条路,后者正是本项目
          # 2026-10-15 在修的病。stage0 的真门是上面第 2 步 `make` ——
          # stage1 用 stage0 编 src0/main.jhyy → jhyy.exe,stage0 一坏就断。
          #
          # v4.0.2 W-073 follow-on GHA gate fix: regress.py lives at project root
          # (regress.py, not compiler/build/bin/regress.py — it was relocated
          # in v4.0.0-rc1 to keep the build/ tree artifact-only). Historical
          # `python compiler/build/bin/regress.py` failed with FileNotFoundError.
          # -u:无缓冲 —— 否则整轮 [progress] 心跳全压在退出时一次性刷出,
          # 时间戳落在同一秒,拿不到执行时序(排查并发问题时的硬障碍)。
          #
          # 2026-10-18:默认 binary 就是上一步刚编出来的那份(此前这一步测的是
          # `git checkout` 换回来的提交产物 —— 那意味着改 src0 的语义回归
          # 一个测试都不会红)。`--jobs` 此前**完全没传**,实际在跑
          # `max(2, cpu//2)`;显式传,让并发度成为配置而不是隐式默认。
          python -u regress.py --all --jobs=2 --timeout=300

      - name: Build Stage 2 closure chain (v1→v2→v3→v4)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          make selfhost

      - name: Stage 2 vs Stage 3 .s byte-equal (closure gate)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          # 真门是 compiler/tests/bootstrap/closure_check.sh:它比 Stage2 vs Stage3
          # 的 .s(约 11 MB),带 `! -s` 非空守卫,已实测能翻红于「编译器静默 exit 0
          # 但不产 .s」——也就是 W-086 那一类假阳性。
          #
          # v4.0.8:本 step 原先内联了 v1→v4 四代的 .il sha 比对,但既没设
          # JHY_WRITE_IL=1(jhyy-side in-mem 路径默认不落 .il),也没检查 sha256sum
          # 的退出码 —— 四个 SHA 全是空串,`"$SHA_V1" != "$SHA_V2"` 对空串恒假,
          # 于是闭环与否都打印 `PASS (sha=)`。比没有门更糟,现在直接调真门。
          bash compiler/tests/bootstrap/closure_check.sh

      - name: Assert every test has a real assertion (zero-signal gate)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          # v4.0.8:每个 .jhyy 都必须有能失败的断言。
          #
          # 背景:regress 的 `163/163 PASS` 曾长期不携带信息 —— 166 个可跑测试里
          # 54 个零信号(43 个只验「进程没崩」,11 个有 `// EXPECT:` 但 main 返回
          # 写死字面量、断言在数学上不可能失败)。W-109(浮点比较算错)就是靠
          # `float_cmp.jhyy` 的「无 EXPECT + 无条件 return 42」活下来的。
          #
          # 门禁语义:**新增一个零信号测试就翻红**,而不是等下次 audit 才发现。
          # `// XFAIL:` 标记的测试不算违规 —— 它声明为「预期失败」,标记是否
          # 撒谎由运行时的 XPASS 负责(XFAIL 测试转绿 = XPASS = regress 失败)。
          python scripts/dev/audit_test_assertions.py --strict
          # 顺带跑 artifact_checks 的**分类逻辑自检**(纯字符串运算,不碰编译器,
          # 亚秒级)。它证明「四种红 + 两种绿」都能正确触发 —— 一道从没被见过
          # 红的门不算门(feedback_ci_gate_must_exercise_path)。
          bash compiler/tests/bootstrap/artifact_checks.sh --selftest

      - name: Emit SysV .s for the Linux-side gate
        if: always()
        shell: msys2 {0}
        run: |
          # 这 6 个测试在 windows-latest 上**跑不了**:link 出来的是 Win PE,
          # 要验 SysV ABI 得用 `runtime/linux_elf/crt0.S` + `link.ld` 链成 ELF。
          # 而 regress.py 的 `--cross=auto` 在 CI 上探测不到能用的环境
          # (windows-latest 没有 Docker daemon,gcc:12 也没有 windows manifest)
          # → 6 个测试永远 SKIP,`_sysv_failed == 0` 就算通过。
          #
          # 拆成两段:本 job 只负责「编出 .s」(需要 Windows 的 jhyy.exe),
          # sysv job 在 ubuntu-latest 上负责「链 + 跑 + 比期望值」。
          #
          # 顺带关掉 regress 里的 wire-only SKIP:这里显式列出 5 个名字,
          # 少编出一个就在本步失败,而不是悄悄进到下游。
          mkdir -p tmp/sysv_il
          TESTS="sysv_abi_test sysv_enum_match sysv_struct_mixed sysv_struct_pass sysv_struct_ret sysv_vararg_basic"
          missing=0
          for t in $TESTS; do
            src="compiler/tests/examples/$t.jhyy"
            [ -f "$src" ] || { echo "::error::缺测试文件 $src"; missing=$((missing+1)); continue; }
            cp -f "$src" "tmp/sysv_il/$t.jhyy"
            compiler/build/bin/jhyy.exe compile --target=amd64_sysv_freestanding --no-link \
                "$src" -o "tmp/sysv_il/$t"
            if [ -s "tmp/sysv_il/$t.s" ]; then
              echo "  ✅ $t.s  $(wc -c < tmp/sysv_il/$t.s) B"
            else
              echo "::error::$t 没产出 .s —— SysV 门将在下游拿不到输入"
              missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # W-104 的跨实现对拍:jhyy 侧 caller(调用 gcc 编译的 callee)。
          # 与上面 6 个测试不同 —— 这里验的是「jhyy 与 **真正的 SysV 实现**
          # 能否互调」,纯 jhyy 测试永远看不到这一类(自洽但不兼容)。
          # ⚠️ 编到**独立目录** tmp/sysv_abi/ —— tmp/sysv_il/ 是 regress 测试的
          # 目录,sysv_link_run.sh 会遍历里面**所有** .s 并要求每个都有
          # `// EXPECT:`。ABI 对拍的 caller 不是 regress 测试(它没有 EXPECT),
          # 放进去会被判「读不到 EXPECT → 失败」。
          mkdir -p tmp/sysv_abi
          for t in sysv_abi_caller sysv_abi_mem_caller sysv_abi_mem_callee; do
            src="compiler/tests/bootstrap/$t.jhyy"
            [ -f "$src" ] || { echo "::error::缺 fixture $src"; exit 1; }
            cp -f "$src" "tmp/sysv_abi/$t.jhyy"
            compiler/build/bin/jhyy.exe compile --target=amd64_sysv_freestanding --no-link \
                "tmp/sysv_abi/$t.jhyy" -o "tmp/sysv_abi/$t"
            if [ ! -s "tmp/sysv_abi/$t.s" ]; then
              echo "::error::没产出 $t.s —— ABI 对拍门无法运行"
              exit 1
            fi
            echo "  $t.s $(wc -c < tmp/sysv_abi/$t.s) B"
          done

      - name: Upload SysV .s artifacts (regress 用例)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysv-il
          path: tmp/sysv_il/
          if-no-files-found: error

      - name: Upload ABI cross-check .s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysv-abi
          path: tmp/sysv_abi/
          if-no-files-found: error

      - name: Artifact-level gates (expected-FAIL model — blocking as of 2026-10-18)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。
        if: always()
        shell: msys2 {0}
        run: |
          # v4.0.8:验那些**不在程序返回值里**的失效模式 —— 它们的症状在编译
          # 产物的字节布局里,任何 .jhyy 测试都验不到(写出来会 PASS)。
          #
          # 2026-10-18:本 step 从 non-blocking 升级为 blocking,因为脚本改成了
          # expected-FAIL 模型。此前是「4 条已登记 ACTIVE → 必然全红 → 配
          # `continue-on-error: true` 忽略」,CI 每轮固定打 `0 PASS / 4 FAIL`。
          # 一个恒红且被忽略的步骤比没有门更糟:它训练人忽略红色。
          #
          # 现在:已知问题显式登记,登记与实际一致就是**绿的**(当前 4 KNOWN-FAIL /
          # 0 FAIL / exit 0),红只留给「不该红的情况」——
          #   · 环境/编译失败      什么都没验到
          #   · 未登记的 check 失败  新 bug,或新 check 忘了登记
          #   · 签名不吻合          已登记的 check 换了失败方式(新 bug 躲在旧 bug 后面)
          #   · UNEXPECTED-PASS     workaround 修好了但登记没删 → 状态失真
          #
          # 升级不需要「真修」,只需要**判据本身是对的** —— 这正是这次改动的意义。
          # 每条 workaround 转 RESOLVED 时,删掉脚本 KNOWN_FAIL 里对应那一行即可,
          # check 自动升级成真门,**不需要再动本文件**。
          #
          # ⚠️ 不要为了让 CI 变绿去放宽 KNOWN_FAIL 里的签名。那正是本项目栽过的坑。
          bash compiler/tests/bootstrap/artifact_checks.sh

      # ── 内置工具链门(v4.1.0)──────────────────────────────────────────
      # installer 从 v4.1.0 起自带一份最小原生 ucrt64 工具链
      # (gcc + binutils + CRT + 头文件闭包),装机用户**不需要 MSYS2**。
      #
      # 这些门验的是「这份工具链真的能独立干活」——此前**零覆盖**:
      #   · 可重定位: 换到带空格的随机路径还能编+链+跑
      #   · 头闭包:   只用收集到的那份就能编 runtime.c / jhyy_helpers.c
      #   · poisoned PATH: PATH 里塞一个别的 ld(MSYS2 POSIX 层那个)也不受影响
      #     ← 这条门抓出了「collect2 按裸名找 ld ⇒ 捡到 PATH 里的 POSIX ld
      #        ⇒ 链接失败且 stderr 零输出」那个真缺陷
      #   · windres:  每次链接都要用它,缺了 ⇒ **每一次**编译都失败
      #
      # `-AllowVersionDrift`:CI 的 runner 镜像是滚动的,MSYS2 版本会漂。
      # 这些门本身与版本无关,所以照样跑;版本 pin 只在**真正出货**的
      # release.yml 里强制(collect 脚本默认响亮失败)。
      - name: Bundled toolchain gates (relocatable / header closure / poisoned PATH)
        shell: msys2 {0}
        run: |
          # The MSYS2 root is NOT C:\msys64 on GitHub Actions (setup-msys2
          # installs into D:\a\_temp\setup-msys2\msys64). Ask the shell where
          # it is and pass it explicitly; the collector also auto-discovers
          # it via the gcc on PATH, so this is belt-and-braces.
          MSYS2_ROOT_WIN=$(cygpath -w /)
          echo "MSYS2 root: $MSYS2_ROOT_WIN"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/scripts/collect-toolchain.ps1 -AllowVersionDrift -MsysRoot "$MSYS2_ROOT_WIN"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/scripts/verify-toolchain.ps1
          # The VSCode terminal profile points at a bash we DETECT. If the
          # detection breaks, the user silently gets "the terminal profile is
          # not available" in VSCode - so it gets its own gate.
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/scripts/verify-vscode-bash-detect.ps1

      # ── MCP 工具的 pytest 套件 ──────────────────────────────────────
      # v4.0.20 (W-134.1):`mcp-jhyy/tests/`(41 个测试)此前在 CI 里**零覆盖**
      # —— ci.yml 既没有 pytest step,也没有任何 pip install ⇒ **套件里的红绿
      # 完全不影响 CI 结论**。实测代价:W-134 那条「恒红」的陈旧测试从 commit
      # f72cef4 起就躺在树里没人发现(它断言的行为早已被换掉)。
      #
      # 门禁语义:**MCP 工具坏了 ⇒ CI 红**。
      #
      # ⚠️ 为什么用 `actions/setup-python` 而不是 job 里已有的 MSYS2 python:
      #   MSYS2 的 mingw64 python **不是标准 Windows CPython** ⇒ PyPI 上
      #   fastmcp 依赖链**没有对应的 wheel** ⇒ pip 只能源码构建 ⇒ 必失败。
      #   (实测:`python -m venv` + `pip install fastmcp` 在 MSYS2 python 下
      #   报「pip subprocess to install build dependencies did not run
      #   successfully」。)
      #   setup-python 给的是标准 CPython ⇒ wheel 直接可用。
      #   本地已用标准 Windows CPython 验证过完整命令:40 passed / 1 skipped。
      #
      # 这两步放在 job **最后**:setup-python 会改 PATH,放在末尾就不会影响
      # 前面那些 msys2 step 用的 MSYS2 python。
      - name: Set up Python (MCP test suite)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MCP server test suite (pytest)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q fastmcp pytest pytest-asyncio
          python -m pytest mcp-jhyy/tests -q

  # ══════════════════════════════════════════════════════════════════════
  # 5 个 SysV ABI 测试 —— 此前在 CI 上**根本不存在门**
  # ══════════════════════════════════════════════════════════════════════
  #
  # `regress.py` 的 `--cross=auto` 在 windows-latest 上三个探测全失败
  # (没有可用的 WSL distro / docker 镜像 gcc:12 没有 windows-amd64 manifest),
  # 于是 cross_mode=none → 6 个 sysv 测试永远 SKIP,`_sysv_failed == 0`
  # 就算通过。CI 日志实证:`cross: --cross=auto → resolved=none`。
  #
  # 而 W-104(SysV caller 侧分类错)与 W-116(SysV callee 只 spill 4 个寄存器)
  # 都在待清零的 ACTIVE 名单里 —— **它们的门压根不存在**。
  #
  # ubuntu-latest 上这条路能通:没有 wsl.exe(wsl 分支自动跳过),
  # `_docker_daemon_up()` 会成功,gcc:12 在 linux/amd64 上有 manifest。
  # docker 分支(`regress.py:377-441`)的 Stage 1(Windows 侧编译)在 Linux 上
  # 本来就可用。`runtime/linux_elf/crt0.S` 与 `link.ld` 都已在仓里。
  sysv:
    name: SysV ABI (6 tests windows-latest can never run)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download .s emitted on the Windows runner
        uses: actions/download-artifact@v4
        with:
          name: sysv-il
          path: tmp/sysv_il

      - name: Download ABI cross-check .s
        uses: actions/download-artifact@v4
        with:
          name: sysv-abi
          path: tmp/sysv_abi

      - name: SysV ABI gate (link + run + compare // EXPECT:)
        run: |
          set -x
          uname -a
          gcc --version | head -1
          ls -la tmp/sysv_il/
            # 7 份一份都不能少(6 个 sysv 测试 + 1 个 ABI 对拍 caller)——
            # 少了就是上游 emit 步出了问题,不能当成通过。
            n=$(ls tmp/sysv_il/*.s 2>/dev/null | wc -l)
            echo "收到 $n 份 regress 用例 .s(期望 6)"
            [ "$n" -eq 6 ] || { echo "::error::.s 数量不对,拒绝报绿"; exit 1; }
            m=$(ls tmp/sysv_abi/*.s 2>/dev/null | wc -l)
            echo "收到 $m 份 ABI 对拍用 .s(期望 3:small caller / MEMORY caller / MEMORY callee)"
            [ "$m" -eq 3 ] || { echo "::error::ABI 对拍 .s 缺失,拒绝报绿"; exit 1; }
            bash compiler/tests/bootstrap/sysv_link_run.sh tmp/sysv_il
          echo ""
          echo "### W-104 跨实现 ABI 对拍(jhyy ↔ gcc)"
          bash compiler/tests/bootstrap/sysv_abi_cross.sh tmp/sysv_abi

  # ══════════════════════════════════════════════════════════════════════
  # 发布 —— 门不绿就发不出去
  # ══════════════════════════════════════════════════════════════════════
  #
  # 2026-10-18 之前,发布由 release.yml 的 `push: tags` 触发。那条路
  # **无法 needs: 别的 workflow**,所以门没过也能发布。实测后果:
  # v3.4.2 / v4.0.0-rc1 / v4.0.1 / v4.0.2 / v4.0.6 五次 tag push 全部失败,
  # 最后一个真实 release 停在 2026-09-08 的 v3.2.0 —— 而同期文档一直在写
  # "v4.0.0-rc1 shipped"。「文档说 shipped」与「有可安装产物」断了 6 周。
  #
  # 现在 release.yml 改成 reusable workflow(`on: workflow_call`),由本 job
  # 以 `needs: build-and-test` 调用 —— 这是 `needs:` 能跨文件生效的唯一途径,
  # 且零代码重复。
  release:
    name: Release installer
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # 创建 GitHub Release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
