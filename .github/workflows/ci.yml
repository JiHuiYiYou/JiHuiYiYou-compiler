# GH Actions CI — JHYY compiler v1.4.7+ (2026-08-14 ship)
#
# v1.4.7 单 regress 入口 + matrix 守门 (取代 v1.4.5 三跑 shim):
#   1. python regress.py --all                            (gated: jhyy.exe;stage0 informational)
#   2. python regress.py --binary=.../jhyy_v1.exe.exe      (matrix only: 只跑那一个 binary)
#   3. make selfhost                                       (build v2/v3/v4 closure chain)
#   4. bash compiler/tests/bootstrap/closure_check.sh      (gated: Stage2 == Stage3 .s)
#   5. python scripts/dev/audit_test_assertions.py --strict (gated: 每个测试都有断言)
#   6. bash compiler/tests/bootstrap/artifact_checks.sh     (non-blocking: 见 step 说明)
#
# 触发面:
#   - push to main (含 v1.x ‖ v2.x ‖ v3.x 任何 commit)
#   - PR to main
#
# Windows runner (windows-latest) — 跟开发机一致 (Windows 10 + MSYS2 bash +
# gcc + QBE + runtime)。其他 OS 留给未来扩展 (per `docs/plans/v2/v2.0.0-os-prep.md`
# amd64_sysv target 之后)。
#
# 守门:
#   - gated binary 全 PASS → CI pass
#   - 任一 gated fail → CI fail (block merge)
#   - informational fail → log only, 不 block PR (matrix row)
#
# 不做 (per `feedback_auto_push_after_commit.md`):
#   - 不自动 push / tag — 保留人工 review

name: JHYY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: 同一 ref 新 push 自动 cancel 在跑的 run, 节省 CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    # 30 → 45:本地实测一次全量 CI 流程(build stage0 + make + regress --all 两个
    # binary + regress --all --include-informational + make selfhost + closure_check)
    # 在 8 核机器上就要 ~15 分钟;GitHub runner 是 2 核且与自举编译的 fork/gcc
    # 争抢,30 分钟不够 —— 超时的 CI 跑一半被砍,比红的 CI 更糟(它既没通过也没
    # 告诉你哪一步没过)。宁可多花 minutes,不要半途而废。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            python
            python-pip

      - name: Set bash as default shell
        shell: msys2 {0}
        run: |
          echo "GH_RUNNER=true" >> $GITHUB_ENV
          echo "MSYS2_PATH=/c/msys64/usr/bin:$PATH" >> $GITHUB_ENV
          which gcc python make

      - name: Build stage 0 (C-side bootstrap)
        shell: msys2 {0}
        run: |
          make stage0

      - name: Build stage 1 (jhyy-side production via stage 0)
        shell: msys2 {0}
        run: |
          make

      - name: "Run regress.py --all (gated: jhyy.exe; jhyy_stage0.exe informational)"
        shell: msys2 {0}
        run: |
          # v4.0.8:stage0 已从 gated 降为 informational —— 它是 C 端 bootstrap,
          # 语言子集早于 v3.x(闭包是 v3.2.1、char literal / Cap<T> 是 v3.x),
          # 实测有 39 个**预期内**的失败。让它 gate 等于派一个注定失败的活,
          # 结果只有「CI 永远红」或「有人放宽判据换绿」两条路,后者正是本项目
          # 2026-10-15 在修的病。stage0 的真门是上面第 2 步 `make` ——
          # stage1 用 stage0 编 src0/main.jhyy → jhyy.exe,stage0 一坏就断。
          #
          # v4.0.2 W-073 follow-on GHA gate fix: regress.py lives at project root
          # (regress.py, not compiler/build/bin/regress.py — it was relocated
          # in v4.0.0-rc1 to keep the build/ tree artifact-only). Historical
          # `python compiler/build/bin/regress.py` failed with FileNotFoundError.
          python regress.py --all

      - name: Run regress.py on jhyy_v1.exe.exe (v1 historical baseline, matrix only)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        continue-on-error: true
        run: |
          # v4.0.8:jhyy_v1.exe.exe = jhyy.exe 的副本,由 `make` 每次构建生成,
          # 不再是 git 里的静态快照。它唯一的作用是给 fixed_point/byte_equal 当
          # 「第 0 代」,使 v1==v2 成为一条真正的**确定性检查**(同一二进制跑
          # 两遍必须产出相同 .il/.s)。
          #
          # v4.0.8 修:本 step 原先跑 `regress.py --all --include-informational`
          # —— 那是把**整个套件再跑一遍**,只为了多验 jhyy_v1.exe(而它就是
          # jhyy.exe 的副本)。实测一次全量在 CI 上要 ~24 分钟,跑两遍必然撞
          # 45 分钟的 job 上限,而 job 超时是**最坏的失败形态**:没有产出、
          # 没有告诉你卡在哪一步。改成只跑那一个 binary。
          # v1 是 jhyy.exe 的**逐字节副本**(make 每次构建重新生成)。
          # 对一个逐字节相同的二进制再跑 200 个测试 = 24 分钟换零信息 ——
          # 同样的字节必然给同样的结果。它的用途是给 fixed_point.sh /
          # byte_equal.sh 当「第 0 代」种子做确定性检查,不是拿来跑套件的。
          # 所以这里只验「副本确实是副本」—— 几十毫秒,信息量还不小:
          # 副本一旦不同步,那两个脚本的 v1==v2 立刻失去意义。
          cmp compiler/build/bin/jhyy.exe compiler/build/bin/jhyy_v1.exe.exe             && echo "v1 是 jhyy.exe 的 byte-equal 副本 ✓"             || { echo "FAIL: jhyy_v1.exe.exe 与 jhyy.exe 不一致 —— 副本约定被破坏"; exit 1; }

      - name: "[DIAG] 三个可疑测试串行 + 600s 上限(是挂死还是极慢)"
        shell: msys2 {0}
        continue-on-error: true
        run: |
          # 2026-10-15 第二轮诊断。
          # 上一轮 `--jobs=1 --timeout=60` 已经确认:**串行也挂** → 确定性的,
          # 不是并发争抢。所以现在的唯一问题是:它是「卡死」还是「极慢」?
          #   600s 内完成 → 极慢,去查为什么 CI 上这几个输入慢 100 倍
          #   600s 仍不完成 → 死循环/死锁,拿这三条最小复现去查
          #
          # 另:上一轮那个「卡在前端或 emit 阶段(无任何产物)」的诊断**不可信** ——
          # `codegen_amd64_run_text` 里 0 处文件写操作,in-mem 路径**根本不写 .s**,
          # 所以「无产物」是常态而非信号。基于它排除掉的一批假设要重新算。
          python regress.py --tests=f32_suffix.jhyy,f64_suffix.jhyy,fmod_basic.jhyy             --jobs=1 --timeout=600

      - name: Build Stage 2 closure chain (v1→v2→v3→v4)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          make selfhost

      - name: Stage 2 vs Stage 3 .s byte-equal (closure gate)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          # 真门是 compiler/tests/bootstrap/closure_check.sh:它比 Stage2 vs Stage3
          # 的 .s(约 11 MB),带 `! -s` 非空守卫,已实测能翻红于「编译器静默 exit 0
          # 但不产 .s」——也就是 W-086 那一类假阳性。
          #
          # v4.0.8:本 step 原先内联了 v1→v4 四代的 .il sha 比对,但既没设
          # JHY_WRITE_IL=1(jhyy-side in-mem 路径默认不落 .il),也没检查 sha256sum
          # 的退出码 —— 四个 SHA 全是空串,`"$SHA_V1" != "$SHA_V2"` 对空串恒假,
          # 于是闭环与否都打印 `PASS (sha=)`。比没有门更糟,现在直接调真门。
          bash compiler/tests/bootstrap/closure_check.sh

      - name: Assert every test has a real assertion (zero-signal gate)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          # v4.0.8:每个 .jhyy 都必须有能失败的断言。
          #
          # 背景:regress 的 `163/163 PASS` 曾长期不携带信息 —— 166 个可跑测试里
          # 54 个零信号(43 个只验「进程没崩」,11 个有 `// EXPECT:` 但 main 返回
          # 写死字面量、断言在数学上不可能失败)。W-109(浮点比较算错)就是靠
          # `float_cmp.jhyy` 的「无 EXPECT + 无条件 return 42」活下来的。
          #
          # 门禁语义:**新增一个零信号测试就翻红**,而不是等下次 audit 才发现。
          # `// XFAIL:` 标记的测试不算违规 —— 它声明为「预期失败」,标记是否
          # 撒谎由运行时的 XPASS 负责(XFAIL 测试转绿 = XPASS = regress 失败)。
          python scripts/dev/audit_test_assertions.py --strict

      - name: Artifact-level gates (non-blocking until W-112/113/107/116 are RESOLVED)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        continue-on-error: true
        run: |
          # v4.0.8:验那些**不在程序返回值里**的失效模式 —— 它们的症状在编译
          # 产物的字节布局里,任何 .jhyy 测试都验不到(写出来会 PASS)。
          #
          # 本 step **故意是 non-blocking**:四条检查各自对应一条已登记的
          # ACTIVE workaround(W-112 link_section no-op / W-113 asm 字节落在
          # ret 之后 / W-107 per-fn 表 1024 上限 / W-116 SysV callee 只 spill
          # 4 个寄存器),所以现在**必然全红**(exit 1)。
          #
          # 它的作用是把这四条从「没人验」变成「每次 CI 都能看见」,而不是
          # 让 CI 变红。四条在 v4.0.15 修完后,把 continue-on-error 删掉即可
          # 升级成 blocking —— 那一步不该由改判据来完成,只能由真修来完成。
          #
          # ⚠️ 不要为了让 CI 变绿而放宽这里的判据。那正是本项目今天栽过的坑。
          bash compiler/tests/bootstrap/artifact_checks.sh
