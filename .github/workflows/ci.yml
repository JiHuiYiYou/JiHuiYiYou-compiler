# GH Actions CI — JHYY compiler
#
# **门的完整清单在 [`docs/internal/FACTS.md` § 2](../../docs/internal/FACTS.md#2-回归与门)**
# —— 一处定义,CI 门(§ 2.2)与本地门(§ 2.3)分开列。
# ⚠️ 本文件**不再自带门表**:2026-11-03 审计实测,这里的表长期与实际脱节
# (列着已删的步骤、漏着十几道真在跑的门),而**没有任何门盯着它** ⇒
# 一份没有门守着的清单 = 下一个漂移源。
#
# **现在清单与实况由门 `docs-facts` 双向对拍**:
#   · workflow 里每个**带 run 块**的步骤要么带 `# gate: <id>` 标记(是门),
#     要么在 `docs_facts_check.py` 的 `NON_GATE_STEPS` 里登记(不是门)
#     ⇒ 新加一个步骤会被迫分类;
#   · 标记的 id ⇄ FACTS § 2.2 的 id **双向相等**;
#   · 每道门**跑的是哪些脚本**也要与 FACTS 那一行对得上
#     ⇒ 「在别的门的步骤里偷偷加一道新门」是看不见的。
#
# **每道门验的是什么边界,别互相误读:**
#   - regress / assert-strength = 正确性 + 断言强度
#   - artifact-fresh           = **提交产物对当前源码的行为一致性**。
#                                比 `.s` 不比 `.exe`(后者跨 toolchain 必假阳性)。
#                                ⚠️ 它看不见 codegen 中性的源码改动 —— 见该 step 注释
#   - make(自举闭环)            = 确定性 + 自洽。**不验正确性** —— 一个确定性的
#                                错误编译器照样闭环通过
#   - artifact-checks          = 那两条验不到的失效模式(症状在产物字节布局里,
#                                任何 .jhyy 测试都验不到)
#
# **所有门测的都是同一个二进制:本 job `make` 刚编出来的那份。** 这一条在
# 2026-10-18 之前是反的 —— regress 测的是 `git checkout HEAD --` 换回来的提交
# 产物,于是「改 src0 引入语义回归」这件事 201 个测试一个都不会红。挡着这层的
# 理由(W-117:CI 编出的编译器行为不同)已于同日闭合,理由不再成立。
#
# **「不验正确性」这句对 artifact-checks 同样适用**:它验的是「某个已知缺陷是否
#   仍以登记的方式存在」,不是「编译器是否正确」。
#
# **[已删 step] 2026-10-18**:`cmp jhyy.exe jhyy_v1.exe.exe` 那一步删掉了,两条理由:
#   1. 它**恒红**。上一步 `git checkout HEAD -- compiler/build/bin/jhyy.exe` 把
#      jhyy.exe 换回 git 版本,而副本是 make 从新编产物 cp 的,两者必然不同。
#      CI 日志每轮都打 `FAIL: 副本约定被破坏` 配 `continue-on-error: true` ——
#      恒红且被忽略的步骤 = 训练人忽略红色。
#   2. 就算不换回,它也**恒真**:`Makefile` 里那条规则字面就是 `cp -f $< $@`,
#      同一次 make 内不可能不同步。被保护者自己保证的不变量不需要门。
#
# **[已删 step] 2026-11-03**:`make selfhost` 与 `closure_check.sh` 两步删掉了 ——
#   `make` 自己的不动点迭代已经把「装出去的那个产物在不动点上」证过一遍,
#   这两步在 CI 里**恒绿**(恒真的断言不是断言,是噪音)。可移植的跨代闭环判据
#   仍在 `compiler/tests/bootstrap/closure_check.sh`(现在是**本地门**)。
#
# 触发面:
#   - push to main (含 v1.x ‖ v2.x ‖ v3.x 任何 commit)
#   - PR to main
#   - 手动 dispatch(此前只能 `gh run rerun` 重跑整轮,不能只重跑某个 job)
#
# **所有门测的都是本 job 刚编出来的 `jhyy.exe`**(2026-10-18 起)。此前 regress
# 测的是 `git checkout HEAD --` 换回来的提交产物,等于改 src0 的语义回归一个
# 测试都不会红。详见下面 build 步的注释与 workarounds.md 的 W-117 条目。
#
# Windows runner (windows-latest) — 跟开发机一致 (Windows 10 + MSYS2 bash +
# gcc + runtime)。
# ⚠️ 2026-11-05:此处此前还列着 **QBE** —— QBE 工具链已于 v4.0.0 完全移除
# (docs/internal/architecture.md § 1「没有 QBE 进程」;qbe/ 目录 v4.1.3 整体删除),
# 现行 CI 只装 gcc + binutils + runtime ⇒ 列着它就是列着一条不存在的工具链。
# 其他 OS 留给未来扩展 (per `docs/archive/plans/v2-v3/v2.0.0-os-prep.md`
# amd64_sysv target 之后 —— 该文件已随 v2/v3 计划归档搬过家)。
#
# 不做 (per `feedback_auto_push_after_commit.md`):
#   - 不自动 push / tag — 保留人工 review

name: JHYY CI

on:
  push:
    branches: [main]
    # ⚠️ tags 必须**单独**列 —— `branches: [main]` 只匹配分支 ref
    # (`refs/heads/main`),不匹配 `refs/tags/*`。2026-10-18 实测:打完
    # v4.0.9-rc1 push 上去,**没有任何 run 被触发**,release job 里那个
    # `if: startsWith(github.ref, 'refs/tags/v')` 根本没机会求值。
    # 也就是说发布链在真 tag 上从来没被跑过 —— 正是这次要消灭的那类静默失效。
    # 注意:GitHub 的 push 过滤器里 branches 与 tags 是**或**关系,不是且。
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

# Concurrency: 同一 ref 新 push 自动 cancel 在跑的 run, 节省 CI minutes。
#
# 2026-10-18 收窄:`cancel-in-progress` 此前**无差别**作用在 push to main 上,
# 会把进行中的主干 run 砍掉一半。PR 上确实该取消(同一分支连续 push,前面的
# 结果已无意义),主干上是另一回事 —— 一次完整跑完的 main run 是发布前的凭据,
# 半途中被取消等于没跑。表达式按 event name 区分。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-latest
    # 30 → 45:本地实测一次全量 CI 流程(build stage0 + make + regress --all 两个
    # binary + regress --all --include-informational + make selfhost + closure_check)
    # 在 8 核机器上就要 ~15 分钟;GitHub runner 是 2 核且与自举编译的 fork/gcc
    # 争抢,30 分钟不够 —— 超时的 CI 跑一半被砍,比红的 CI 更糟(它既没通过也没
    # 告诉你哪一步没过)。宁可多花 minutes,不要半途而废。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            python
            python-pip

      - name: Set bash as default shell
        shell: msys2 {0}
        run: |
          echo "GH_RUNNER=true" >> $GITHUB_ENV
          echo "MSYS2_PATH=/c/msys64/usr/bin:$PATH" >> $GITHUB_ENV
          # v4.1.0: 把本 job 用的 MSYS2 根目录显式导出。GitHub runner 镜像
          # 自带一套旧 MSYS2 在 C:\mingw64(gcc 15.2.0),与 setup-msys2 装的
          # 新的一套(gcc 16.2.0)同时在 Windows PATH 上 ⇒ pwsh 步里按 PATH
          # 找 gcc 会挑中旧的 ⇒ 工具链版本 pin 失败。`/` 在 MSYS2 shell 里
          # 就是本 job 正在用的那套 ⇒ cygpath -w / 给出正解。
          echo "JHY_MSYS2_ROOT=$(cygpath -w /)" >> $GITHUB_ENV
          which gcc python make

      - name: Build jhyy.exe (self-bootstrap) — 回归门就测这个产物
        shell: msys2 {0}
        run: |
          # gate: selfhost
          # ── 工具链版本上报(刻意**不**钉版本)────────────────────────────
          # 为什么不上 `setup-msys2` 的 `update: false`:
          # **它换不来可复现性**。GitHub 的 `windows-latest` 本身是滚动镜像,
          # 每周更新、每次自带某个 MSYS2 状态;`update: false` 只是说「不在本次
          # job 内额外升级」,镜像照样漂。设了它会制造一个「已经可复现」的错觉,
          # 而错觉比不设更糟 —— 本次会话已经吃过一次这种亏(见 Makefile 里
          # STRICT_TOOLCHAIN 注释:它拿 `.exe` 跨 toolchain 比,报出来的漂移
          # 没有一条是真问题)。
          #
          # 真正要的是:**一条「因为工具链变了」而红的 CI 能立刻被归因**,
          # 而不是让人猜「是不是我们改坏了」。所以把四个版本写进 job summary ——
          # 它在 run 页面顶部,不用翻日志。
          {
            echo "### 工具链"
            echo ""
            echo "| 组件 | 版本 |"
            echo "|------|------|"
            echo "| gcc    | $(gcc --version 2>/dev/null | head -1) |"
            echo "| as     | $(as --version 2>/dev/null | head -1) |"
            echo "| ld     | $(ld --version 2>/dev/null | head -1) |"
            echo "| python | $(python --version 2>&1 | head -1) |"
            echo ""
            echo "runner 镜像是滚动的,工具链会随时间变化 —— 这是**已知且刻意接受**的。"
            echo "因此所有产物判定一律比 `.s`(源码 × 编译器的函数)而不是 `.exe`"
            echo "(源码 × 工具链版本的函数)。"
          } >> "$GITHUB_STEP_SUMMARY"

          # v4.0.8:`make` 用 jhyy.exe 自己编 src0,并做 byte-equal 自举闭环检查。
          #
          # STRICT_TOOLCHAIN=0 的理由(2026-10-18 修正措辞):它比的是 `.exe` 字节,
          # 而 `.exe` 是 (源码 × **工具链版本**) 的函数。同机同 toolchain 重建是
          # 逐字节可复现的(实测两次 `make` 同得 1eeb81b5),但 CI runner 的
          # gcc 16.2.0 / ld 2.47 与开发机的 15.2.0 / 2.45 必然产出不同字节 ——
          # 那不是漂移,是两个不同工具链的正常结果。该门对**发布者**有意义
          # (「我编出来的 == 我提交进仓的那份吗」),对 CI 没有意义。
          #
          # 2026-10-17 至 2026-10-18 之间这里曾把产物 `git checkout` 回提交那份,
          # 并打 warning 说「CI 编出的编译器行为与发布的不同(W-117)」。那句话是
          # **错的**:W-117 已于 2026-10-18 闭合(根因 = IL lexer 在 EOF 处无守卫,
          # `lex_peek_byte` 无 `cur < end` 边界检查 + `lex_next_byte` 在 EOF 不推进
          # cur),该症状在受控 A/B 下不复现 —— 见 docs/internal/workarounds.md。
          #
          # 现在:**不换回产物**。回归门测的就是本 job 刚编出来的这份,也就是
          # **当前源码**编出来的编译器。改 src0 引入的语义回归,201 个测试
          # 至少有一个会红 —— 这正是这道门存在的意义。
          make STRICT_TOOLCHAIN=0
          echo "本 job 编译出的 jhyy.exe: $(sha256sum compiler/build/bin/jhyy.exe | cut -d' ' -f1)"
          echo "后续所有门(regress / closure / artifact_checks)都测这一个二进制。"

      - name: 提交产物与当前源码同步(artifact-fresh)
        # ══════════════════════════════════════════════════════════════
        # 这道门守的是「**fresh clone 拿到的那份二进制**」——
        # `compiler/build/bin/jhyy.exe` 是 git 跟踪的 bootstrap 种子,
        # 绝大多数人 clone 下来拿到的就是它。
        #
        # 为什么需要:2026-10-18 第 3 期把 build 步里的
        # `git checkout HEAD -- compiler/build/bin/jhyy.exe` 删掉了 ——
        # 那一步有两个功能,第一个(让 regress 测陈旧产物)是缺陷,有意删;
        # 第二个(**让提交产物被读到**)是副作用,我没意识到就一起删了,
        # 随后又把提到它的那条 warning 也删了。于是这个问题从「答了一半」
        # 变成「完全没人答」:
        #
        #     改了 src0 但忘了重新提交 jhyy.exe → CI 全绿
        #     而 fresh clone 拿到的正是没更新的那份
        #
        # 比什么:比 **`.s`,不比 `.exe`**。`.s` 是 (源码 × 编译器) 的函数,
        # 与 host gcc 版本无关;`.exe` 是 (源码 × 工具链版本) 的函数,跨
        # toolchain 比必假阳性 —— W-117 那条 TOOLCHAIN-DRIFT 就是拿 `.exe`
        # 跨 toolchain 比出来的噪音。
        #
        # ⚠️ **这道门看不见什么(实测,别夸大它)**:
        # 它比的是「提交产物对当前源码的**行为**」,不是「提交产物的字节」。
        # 因此**任何 codegen 中性的源码改动它都看不见** —— 实测:
        #   W-117 修复前后那两个编译器编同一份 src0,产出逐字节相同
        #   (都是 dd3cc455)—— 因为那个修复(加 EOF 守卫)本身输出中性。
        # 行为相同意味着在链路上它们可互换,所以门判「绿」是对的;
        # 但新 clone 拿到的编译器确实比源码**旧**,带着那个已被修掉的隐患。
        # 对这一类,下面那条 git 层的 annotation 会点出来。
        shell: msys2 {0}
        run: |
          # gate: artifact-fresh
          #
          # ⚠️ 2026-11-05:这段判据原先是**本 step 里的一段内联 shell** ——
          # 现在抽成了 `compiler/tests/bootstrap/artifact_fresh_check.sh`,
          # 因为 **release job 自己那次 `make` 重建也要做同一道对拍**
          # (见 release.yml 的 `release-anchor` 门)。「同一道判据写两遍」
          # = 两套实现必然分叉 —— Makefile 顶部记着 C 端/jhyy 端两套实现
          # 分叉的旧账(W-127/128/129 就是分叉出来的,C 侧的 W-133 至今没同步
          # ⇒ stage0 编译**静默错值**)。⇒ 一份实现,两处调用。
          set -e
          bash compiler/tests/bootstrap/artifact_fresh_check.sh
          BIN=compiler/build/bin/jhyy.exe

          # 这道门看不见的那一类:codegen 中性的 src0 改动。用 git 层的信息点出来,
          # **不阻断** —— 它只是一个「你可能忘了」提示,而唯一能确定判定的信号
          # (二进制 sha)在跨 toolchain 时是假阳性,不能拿来当门。
          #
          # 先确认 HEAD~1 存在:仓库的第一个 commit 没有父,`git diff HEAD~1 HEAD`
          # 会报错而非返回 0,不先判一下会在那种情况下误报。
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if ! git diff --quiet HEAD~1 HEAD -- compiler/src0/ \
               && git diff --quiet HEAD~1 HEAD -- "$BIN"; then
              echo "::warning title=src0 变了但二进制没跟着提交::本次 commit 改了 compiler/src0/ 却没改 $BIN。"
              echo "::warning::本门比的是行为;codegen 中性的改动(例如加一个边界守卫)它看不见 ——"
              echo "::warning::那种情况下新 clone 会拿到一个落后于源码的编译器。确认是否需要重新 make 并提交。"
            fi
          fi

      - name: "Run regress.py --all (gated: jhyy.exe)"
        shell: msys2 {0}
        run: |
          # gate: regress
          # v4.0.8:stage0 已从 gated 降为 informational —— 它是 C 端 bootstrap,
          # 语言子集早于 v3.x(闭包是 v3.2.1、char literal / Cap<T> 是 v3.x),
          # 实测有 39 个**预期内**的失败。让它 gate 等于派一个注定失败的活,
          # 结果只有「CI 永远红」或「有人放宽判据换绿」两条路,后者正是本项目
          # 2026-10-15 在修的病。stage0 的真门是上面第 2 步 `make` ——
          # stage1 用 stage0 编 src0/main.jhyy → jhyy.exe,stage0 一坏就断。
          #
          # v4.0.2 W-073 follow-on GHA gate fix: regress.py lives at project root
          # (regress.py, not compiler/build/bin/regress.py — it was relocated
          # in v4.0.0-rc1 to keep the build/ tree artifact-only). Historical
          # `python compiler/build/bin/regress.py` failed with FileNotFoundError.
          # -u:无缓冲 —— 否则整轮 [progress] 心跳全压在退出时一次性刷出,
          # 时间戳落在同一秒,拿不到执行时序(排查并发问题时的硬障碍)。
          #
          # 2026-10-18:默认 binary 就是上一步刚编出来的那份(此前这一步测的是
          # `git checkout` 换回来的提交产物 —— 那意味着改 src0 的语义回归
          # 一个测试都不会红)。`--jobs` 此前**完全没传**,实际在跑
          # `max(2, cpu//2)`;显式传,让并发度成为配置而不是隐式默认。
          python -u regress.py --all --jobs=2 --timeout=300 --summary-json tmp/regress-summary.json

      # ── 「事实为真」对拍门(2026-11-03 加)─────────────────────────────
      #
      # 为什么需要这道门:docs 门(`docs_facts_check.py`)强制的是「这个数在
      # **所有文档里一致**」,而它自己的变异测试写得很明白 ——「它不证明
      # FACTS.md 的数为真」。⇒ 那句「真跑一遍 regress 再对拍」从来没落地。
      # ⇒ 实测:加一个测试文件 → 真实总数从 285 变 286 ⇒ FACTS.md 还写 285
      # ⇒ **docs 门 / 变异测试 / bump_version 全绿**。
      # ⇒ 全仓被复述最多的数字(曾出现在 31 份文档里)恰恰没有真相源校验。
      #
      # 这道门拿**上一步的实测计数**(regress 自己落的 JSON)与 FACTS 对拍,
      # 外加断言审计的**静态数**(扫了多少 .jhyy / 多少可跑 / 多少真断言)——
      # 后者与机器无关,谁都能复现同一个数。
      #
      # ⚠️ 摘要缺失 ⇒ 这道门**红**(不是跳过):「拿不到实测数」正是它要抓的
      # 那种状态(数字无从验证)。
      - name: Regression facts gate (FACTS.md == 实测计数)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: regress-facts
          python scripts/dev/check_regress_facts.py tmp/regress-summary.json

      # ⚠️ 2026-11-03:这里曾经有的两道闭环门(`make selfhost` + `closure_check.sh`)
      # **删掉了** —— 它们在 CI 里**恒绿**:上面的 `make` 已经把锚点迭代到不动点,
      # 「装出去的那个产物 = 不动点」当场被证过一遍,再跑一次只是复述结论。
      # 仓里的规矩:**被保护者自己保证的不变量不需要门**。
      # 可移植的跨代闭环判据仍在 `compiler/tests/bootstrap/closure_check.sh`
      # (现在是**本地门**,见 docs/internal/FACTS.md § 2.3)。

      - name: Assert every test has a real assertion (zero-signal gate)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。step 7 仍是唯一的硬门,其余是补充信息。
        if: always()
        shell: msys2 {0}
        run: |
          # gate: assert-strength
          # v4.0.8:每个 .jhyy 都必须有能失败的断言。
          #
          # 背景:regress 的 `163/163 PASS` 曾长期不携带信息 —— 166 个可跑测试里
          # 54 个零信号(43 个只验「进程没崩」,11 个有 `// EXPECT:` 但 main 返回
          # 写死字面量、断言在数学上不可能失败)。W-109(浮点比较算错)就是靠
          # `float_cmp.jhyy` 的「无 EXPECT + 无条件 return 42」活下来的。
          #
          # 门禁语义:**新增一个零信号测试就翻红**,而不是等下次 audit 才发现。
          # `// XFAIL:` 标记的测试不算违规 —— 它声明为「预期失败」,标记是否
          # 撒谎由运行时的 XPASS 负责(XFAIL 测试转绿 = XPASS = regress 失败)。
          python scripts/dev/audit_test_assertions.py --strict

      - name: Emit SysV .s for the Linux-side gate
        if: always()
        shell: msys2 {0}
        run: |
          # gate: sysv-emit
          # 这 6 个测试在 windows-latest 上**跑不了**:link 出来的是 Win PE,
          # 要验 SysV ABI 得用 `runtime/linux_elf/crt0.S` + `link.ld` 链成 ELF。
          # 而 regress.py 的 `--cross=auto` 在 CI 上探测不到能用的环境
          # (windows-latest 没有 Docker daemon,gcc:12 也没有 windows manifest)
          # → 6 个测试永远 SKIP,`_sysv_failed == 0` 就算通过。
          #
          # 拆成两段:本 job 只负责「编出 .s」(需要 Windows 的 jhyy.exe),
          # sysv job 在 ubuntu-latest 上负责「链 + 跑 + 比期望值」。
          #
          # 顺带关掉 regress 里的 wire-only SKIP:这里显式列出 5 个名字,
          # 少编出一个就在本步失败,而不是悄悄进到下游。
          mkdir -p tmp/sysv_il
          TESTS="sysv_abi_test sysv_enum_match sysv_struct_mixed sysv_struct_pass sysv_struct_ret sysv_vararg_basic"
          missing=0
          for t in $TESTS; do
            src="compiler/tests/examples/$t.jhyy"
            [ -f "$src" ] || { echo "::error::缺测试文件 $src"; missing=$((missing+1)); continue; }
            cp -f "$src" "tmp/sysv_il/$t.jhyy"
            compiler/build/bin/jhyy.exe compile --target=amd64_sysv_freestanding --no-link \
                "$src" -o "tmp/sysv_il/$t"
            if [ -s "tmp/sysv_il/$t.s" ]; then
              echo "  ✅ $t.s  $(wc -c < tmp/sysv_il/$t.s) B"
            else
              echo "::error::$t 没产出 .s —— SysV 门将在下游拿不到输入"
              missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # W-104 的跨实现对拍:jhyy 侧 caller(调用 gcc 编译的 callee)。
          # 与上面 6 个测试不同 —— 这里验的是「jhyy 与 **真正的 SysV 实现**
          # 能否互调」,纯 jhyy 测试永远看不到这一类(自洽但不兼容)。
          # ⚠️ 编到**独立目录** tmp/sysv_abi/ —— tmp/sysv_il/ 是 regress 测试的
          # 目录,sysv_link_run.sh 会遍历里面**所有** .s 并要求每个都有
          # `// EXPECT:`。ABI 对拍的 caller 不是 regress 测试(它没有 EXPECT),
          # 放进去会被判「读不到 EXPECT → 失败」。
          mkdir -p tmp/sysv_abi
          for t in sysv_abi_caller sysv_abi_mem_caller sysv_abi_mem_callee; do
            src="compiler/tests/bootstrap/$t.jhyy"
            [ -f "$src" ] || { echo "::error::缺 fixture $src"; exit 1; }
            cp -f "$src" "tmp/sysv_abi/$t.jhyy"
            compiler/build/bin/jhyy.exe compile --target=amd64_sysv_freestanding --no-link \
                "tmp/sysv_abi/$t.jhyy" -o "tmp/sysv_abi/$t"
            if [ ! -s "tmp/sysv_abi/$t.s" ]; then
              echo "::error::没产出 $t.s —— ABI 对拍门无法运行"
              exit 1
            fi
            echo "  $t.s $(wc -c < tmp/sysv_abi/$t.s) B"
          done

      - name: Upload SysV .s artifacts (regress 用例)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysv-il
          path: tmp/sysv_il/
          if-no-files-found: error

      - name: Upload ABI cross-check .s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysv-abi
          path: tmp/sysv_abi/
          if-no-files-found: error

      - name: Artifact-level gates (expected-FAIL model — blocking as of 2026-10-18)
        # 2026-10-15:`always()` 只控制「是否执行」,不影响「失败是否计入 job 结论」。
        #   加它是因为 job 原本在第一个失败 step 就中止 —— 一次 CI 周期只能拿到一个
        #   结论,排查要等好几轮。
        if: always()
        shell: msys2 {0}
        run: |
          # gate: artifact-checks
          # v4.0.8:验那些**不在程序返回值里**的失效模式 —— 它们的症状在编译
          # 产物的字节布局里,任何 .jhyy 测试都验不到(写出来会 PASS)。
          #
          # 2026-10-18:本 step 从 non-blocking 升级为 blocking,因为脚本改成了
          # expected-FAIL 模型。此前是「4 条已登记 ACTIVE → 必然全红 → 配
          # `continue-on-error: true` 忽略」,CI 每轮固定打 `0 PASS / 4 FAIL`。
          # 一个恒红且被忽略的步骤比没有门更糟:它训练人忽略红色。
          #
          # 现在:已知问题显式登记,登记与实际一致就是**绿的**(当前 4 KNOWN-FAIL /
          # 0 FAIL / exit 0),红只留给「不该红的情况」——
          #   · 环境/编译失败      什么都没验到
          #   · 未登记的 check 失败  新 bug,或新 check 忘了登记
          #   · 签名不吻合          已登记的 check 换了失败方式(新 bug 躲在旧 bug 后面)
          #   · UNEXPECTED-PASS     workaround 修好了但登记没删 → 状态失真
          #
          # 升级不需要「真修」,只需要**判据本身是对的** —— 这正是这次改动的意义。
          # 每条 workaround 转 RESOLVED 时,删掉脚本 KNOWN_FAIL 里对应那一行即可,
          # check 自动升级成真门,**不需要再动本文件**。
          #
          # ⚠️ 不要为了让 CI 变绿去放宽 KNOWN_FAIL 里的签名。那正是本项目栽过的坑。
          bash compiler/tests/bootstrap/artifact_checks.sh
          # 顺带跑 artifact_checks 的**分类逻辑自检**(纯字符串运算,不碰编译器,
          # 亚秒级)。它证明「四种红 + 两种绿」都能正确触发 —— 一道从没被见过
          # 红的门不算门(feedback_ci_gate_must_exercise_path)。
          # ⚠️ 2026-11-03 从「断言强度」那个 step 挪到这里:自检的是**这个脚本**的
          # 分类逻辑 ⇒ 它跟这道门是同一件事,不该挂在别的门底下
          # (一个 step 只承载一道门 ⇒ 门清单里的 id 才查得出它是什么)。
          bash compiler/tests/bootstrap/artifact_checks.sh --selftest

      # ── 运行时性能门(v4.2.0)────────────────────────────────────────────
      #
      # 这道门守的是「**生成代码的质量**」—— 编译器跑得对不等于跑得快。
      # 自研后端自 v3.1.0 起是唯一生产路径 ⇒ 它的 codegen 质量直接决定
      # 用户程序的运行时,也决定编译器自己的自举速度(12.5s)。
      #
      # ⚠️ **墙钟不在这道门里**:GitHub 的共享 runner 宿主负载不可控
      # (同一个 gcc -O2 的 fib 在不同 step 里能差 3 倍)⇒ 拿它当硬门只会
      # 制造假红,而「恒红且被忽略的步骤比没有门更糟」(本项目栽过)。
      # ⇒ **墙钟只报告**,进 job summary 给人看趋势。
      #
      # ✅ **硬门是静态指标**:指令数 / 访存数 / 帧大小 / chkstk 次数
      # —— 它们是「源码 × 编译器」的**确定性函数** ⇒ 同一份源码 + 同一个
      # 编译器 ⇒ 逐字节相同 ⇒ 跨机器跨 runner 都不漂 ⇒ 可以当硬门。
      #
      # 基线在 scripts/dev/bench/runtime_perf.baseline.json。
      # ⚠️ 更新基线必须写明理由 —— 它锁的是「已经拿到的收益」,不是「现状」。
      - name: 运行时性能门(静态指标硬门 + 墙钟报告)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: perf
          set +e
          # python 在 PATH 上可能是 runner 镜像自带的旧 mingw64 那份,也可能是
          # setup-msys2 装的 ucrt64 那份 —— 两者都是 CPython 且本脚本只用标准库,
          # 所以用哪个都行;但**不能假设名字** ⇒ 逐个试。
          PY=""
          for c in python python3; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "ERROR: python not found on PATH" >&2
            exit 2
          fi
          echo "using python: $PY ($($PY --version 2>&1))"
          OUT=$("$PY" scripts/dev/bench/runtime_perf.py --ci 2>&1)
          RC=$?
          echo "$OUT"
          {
            echo "### 运行时性能(v4.2.0)"
            echo ""
            echo '```'
            echo "$OUT"
            echo '```'
            echo ""
            echo "**墙钟只报告不拦** —— 共享 runner 的宿主负载不可控。"
            echo "**硬门是静态指标**(指令数/访存数/帧大小/chkstk)—— 确定性 ⇒ 跨机器不漂。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      # ── 基准门(v4.3.0)──────────────────────────────────────────────────
      #
      # 这道门守的是「**对外发布的那张表**」—— 基准套件的正确性与回归。
      #
      # 与 `perf` 门的分工(两份基线**管的任务不重叠** ⇒ 没有"改了 A 忘了改 B"
      # 的漂移):
      #   · `perf` 门     —— fib/ack/nq 的**静态指标**基线(v4.2.0 起就有)
      #   · `bench-perf` 门 —— 全部题目的**正确性** + **二进制体积**
      #                      + 其余题目的静态指标
      #
      # ⚠️ **墙钟不在这道门里** —— 同 `perf` 门:共享 runner 的宿主负载不可控
      # (同一个程序在不同 step 里能差 3 倍)⇒ 拿它当硬门只会制造假红。
      # ⚠️ **二进制体积**是这道门带来的**新**约束:此前体积没有任何门在管,
      # 而它是确定性的(同一份源码 × 同一个编译器 ⇒ 逐字节相同)。
      - name: Benchmark gate (correctness + binary size + static metrics)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: bench-perf
          set +e
          PY=""
          for c in python python3; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "ERROR: python not found on PATH" >&2
            exit 2
          fi
          echo "using python: $PY ($($PY --version 2>&1))"
          OUT=$("$PY" bench/bench.py --ci 2>&1)
          RC=$?
          echo "$OUT"
          {
            echo "### 基准套件"
            echo ""
            echo '```'
            echo "$OUT"
            echo '```'
            echo ""
            echo "**墙钟只报告不拦** —— 共享 runner 的宿主负载不可控。"
            echo "**硬门是正确性 / 静态指标 / 二进制体积** —— 确定性 ⇒ 跨机器不漂。"
          } >> "$GITHUB_STEP_SUMMARY"
          # 顺带跑本脚本的**自检**(纯判定逻辑,不碰编译器,亚秒级)——
          # 它证明「静态指标回归 / 体积回归 / stdout 不一致」都能触发,
          # 且「地板占比过高 ⇒ 报 n/a 而不是垃圾数」这条也真的在跑 ——
          # 一道从没被见过红的门不算门(feedback_ci_gate_must_exercise_path)。
          # ⚠️ 自检的是**这个脚本**的判定逻辑 ⇒ 跟这道门是同一件事,
          # 不该挂在别的门底下(一个 step 只承载一道门 ⇒ 门清单里的 id 才查得出
          # 它是什么)。同 artifact-checks 的做法。
          "$PY" bench/bench.py --selftest
          RC2=$?
          if [ "$RC2" -ne 0 ]; then RC=$RC2; fi
          exit $RC

      # ── 差分对拍门(v4.3.3)──────────────────────────────────────────────
      #
      # 这道门是**正确性**门:随机生成程序 ⇒ 同一棵 AST 出 C 与 jhyy 两份源码
      # ⇒ 编译两个产物 ⇒ **stdout 逐字比对**。
      #
      # 它跑**两个模式**:
      #   · **规避模式** —— 避开已知缺陷的触发面 ⇒ 门红 ⇔ 有**新**缺陷
      #     (CI 硬门判的就是它)
      #   · **全量模式** —— 不规避 ⇒ 已知缺陷(W-185/W-186)会在这里冒出来
      #     ⇒ 用来盯住"已知缺陷的行为有没有变"(变了也红)
      #
      # ⚠️ **金标准**(`bench/seeds/golden.json`)让这道门同时是「行为回归门」:
      #   差分测试器只看"两侧是否一致" ⇒ 一致 ≠ 正确 ⇒ 金标准补上这一维。
      #
      # ⚠️ **jhyy 拒绝编译不算红** —— 生成器可能越出了 jhyy 接受的子集
      #   (我们自己的锅,不该挡住 CI);只有**输出不一致 / 运行时崩溃**才红。
      - name: Differential test gate (random programs, C vs jhyy, byte-identical stdout)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: bench-diff
          set +e
          PY=""
          for c in python python3; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "ERROR: python not found on PATH" >&2
            exit 2
          fi
          echo "using python: $PY ($($PY --version 2>&1))"
          OUT=$("$PY" bench/difftest.py --seeds bench/seeds/ci.txt --ci 2>&1)
          RC=$?
          echo "$OUT"
          {
            echo "### 差分对拍(v4.3.3)"
            echo ""
            echo '```'
            echo "$OUT"
            echo '```'
            echo ""
            echo "**红 = 有新缺陷**(W-185/W-186/W-187 已真修 ⇒ 已知缺陷清单已清空,规避模式当前不规避任何东西 ⇒ 规避 ≡ 全量)。"
          } >> "$GITHUB_STEP_SUMMARY"
          # 顺带跑自检(亚秒级)—— 它证明「注入的错误」与「坏源码」都能被抓到。
          "$PY" bench/difftest.py --selftest
          RC2=$?
          if [ "$RC2" -ne 0 ]; then RC=$RC2; fi
          exit $RC

      # ── 内置工具链门(v4.1.0)──────────────────────────────────────────
      # installer 从 v4.1.0 起自带一份最小原生 ucrt64 工具链
      # (gcc + binutils + CRT + 头文件闭包),装机用户**不需要 MSYS2**。
      #
      # 这些门验的是「这份工具链真的能独立干活」——此前**零覆盖**:
      #   · 可重定位: 换到带空格的随机路径还能编+链+跑
      #   · 头闭包:   只用收集到的那份就能编 runtime.c / jhyy_helpers.c
      #   · poisoned PATH: PATH 里塞一个别的 ld(MSYS2 POSIX 层那个)也不受影响
      #     ← 这条门抓出了「collect2 按裸名找 ld ⇒ 捡到 PATH 里的 POSIX ld
      #        ⇒ 链接失败且 stderr 零输出」那个真缺陷
      #   · windres:  每次链接都要用它,缺了 ⇒ **每一次**编译都失败
      #
      # `-AllowVersionDrift`:CI 的 runner 镜像是滚动的,MSYS2 版本会漂。
      # 这些门本身与版本无关,所以照样跑;版本 pin 只在**真正出货**的
      # release.yml 里强制(collect 脚本默认响亮失败)。
      - name: Bundled toolchain gates (relocatable / header closure / poisoned PATH)
        shell: msys2 {0}
        run: |
          # gate: toolchain
          # The MSYS2 root is NOT C:\msys64 on GitHub Actions (setup-msys2
          # installs into D:\a\_temp\setup-msys2\msys64). Ask the shell where
          # it is and pass it explicitly; the collector also auto-discovers
          # it via the gcc on PATH, so this is belt-and-braces.
          MSYS2_ROOT_WIN=$(cygpath -w /)
          echo "MSYS2 root: $MSYS2_ROOT_WIN"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/scripts/collect-toolchain.ps1 -AllowVersionDrift -MsysRoot "$MSYS2_ROOT_WIN"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/scripts/verify-toolchain.ps1

      # ⚠️ 2026-11-03:这一条**从上面那个 step 里拆出来**。
      # 拆的理由不是「好看」:一个 step 只能承载**一道门**(门清单里 id 一一对应),
      # 而这里跑的是**另一个判据**(扩展的 terminal profile 指向的 bash 必须真的存在)
      # —— 它挂在工具链门下面,清单里却查不出它独立是什么。
      - name: VSCode bash detection (扩展的 terminal profile 指向的 bash 必须真实存在)
        shell: msys2 {0}
        run: |
          # gate: vscode-bash
          # The VSCode terminal profile points at a bash we DETECT. If the
          # detection breaks, the user silently gets "the terminal profile is
          # not available" in VSCode - so it gets its own gate.
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/scripts/verify-vscode-bash-detect.ps1

      # ── MCP 工具的 pytest 套件 ──────────────────────────────────────
      # v4.0.20 (W-134.1):`mcp-jhyy/tests/`(41 个测试)此前在 CI 里**零覆盖**
      # —— ci.yml 既没有 pytest step,也没有任何 pip install ⇒ **套件里的红绿
      # 完全不影响 CI 结论**。实测代价:W-134 那条「恒红」的陈旧测试从 commit
      # f72cef4 起就躺在树里没人发现(它断言的行为早已被换掉)。
      #
      # 门禁语义:**MCP 工具坏了 ⇒ CI 红**。
      #
      # ⚠️ 为什么用 `actions/setup-python` 而不是 job 里已有的 MSYS2 python:
      #   MSYS2 的 mingw64 python **不是标准 Windows CPython** ⇒ PyPI 上
      #   fastmcp 依赖链**没有对应的 wheel** ⇒ pip 只能源码构建 ⇒ 必失败。
      #   (实测:`python -m venv` + `pip install fastmcp` 在 MSYS2 python 下
      #   报「pip subprocess to install build dependencies did not run
      #   successfully」。)
      #   setup-python 给的是标准 CPython ⇒ wheel 直接可用。
      #   本地已用标准 Windows CPython 验证过完整命令:40 passed / 1 skipped。
      #
      # 这两步放在 job **最后**:setup-python 会改 PATH,放在末尾就不会影响
      # 前面那些 msys2 step 用的 MSYS2 python。
      - name: Set up Python (MCP test suite)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MCP server test suite (pytest)
        shell: bash
        run: |
          # gate: mcp-pytest
          python -m pip install --disable-pip-version-check -q fastmcp pytest pytest-asyncio
          python -m pytest mcp-jhyy/tests -q

      # ── 版本号零漂移门(v4.1.2)────────────────────────────────────────
      # 放在 job **最后** + `if: always()`:这样它翻红时**不会**把前面任何一道
      # 门跳过(中途失败会 skip 后续不带 always() 的 step ⇒ 一道版本漂移会把
      # 真正的失败原因藏起来)。这跟本 job 里其它 `if: always()` 的门同一个理由。
      #
      # 为什么要有这道门:版本号散在 8 个地方(编译器横幅字面量 / EULA / scoop json /
      # winget manifest 目录名+3 个 yaml / 两份 README 的徽章 / changelog /
      # release notes 片段),手改必漏一处 —— 而漏了的后果是「tag v4.1.2 但装出来的
      # 编译器自报 v4.1.1」。`scripts/dev/bump_version.py set X.Y.Z` 现在把这件事
      # 变成一条命令;本门验的是**仓内自洽**(VERSION == 每一处的版本串)。
      # 「VERSION == tag」由 release.yml 在发版第一步断言。
      - name: Version consistency gate (VERSION == every embedded version)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: version
          python scripts/dev/bump_version.py check

      # 文档事实对拍门(2026-10-30 加)。
      #
      # 为什么要有这道门:本仓曾把「回归通过数」写在 31 份文档里、把「ACTIVE 数」
      # 写在 25 份里 —— 于是两份 README 的版本徽章落后 8 个 release,而 CI 全绿。
      # 根因是**事实没有单一真相源** + 门只扫 6 个位置。
      # 现在:数字只写在 docs/internal/FACTS.md,其它文档引用它;本门对拍 FACTS.md 与现实
      # (VERSION / 台账索引 / 门数 / 回归基线),并检查全仓链接与锚点。
      - name: Docs facts gate (FACTS.md == reality, no broken links, no dangling bare paths)
        # 2026-10-31 扩了两项:① 台账**正文**解析(5 态枚举 / per-status 计数 /
        #   索引↔正文状态一致)② **反引号里的裸路径**(此前整类无人扫过 ——
        #   inline 链接 0 断链容易让人以为「文档引用健康」,实际只覆盖了一半)。
        if: always()
        shell: msys2 {0}
        run: |
          # gate: docs-facts
          python scripts/dev/docs_facts_check.py

      # 文档门的**变异测试**(2026-11-02 加)—— 证明上一道门真的看得见它声称看的东西。
      #
      # 为什么要有这道门:2026-11-02 审计实测出 `docs_facts_check.py` 有**四个叠加**的
      # 盲区(剥代码块 / 上下文必须同行 / 词表窄 / 含日期的行被豁免)⇒ 把 `FACTS.md` +
      # 两份 README 的回归数一起改成**自洽但假**的 999/1019,本门与其它 4 道门**全绿**。
      # ⇒ 「事实单一真相源」当时只兑现了一半(只强制一致,不强制为真)。
      #
      # 本 step 往仓里注入 11 个**故意的错误**,逐个确认 docs_facts_check 会红;
      # 跑完把每个文件**原样还原**(try/finally)。
      #
      # 另有 2 个**「自洽但假」**的整链变异(FACTS + 两份 README 一起改成同一个
      # 假数)⇒ 这类变异 docs 门**本来就该绿**(它只管一致性)⇒ 断言它红的是
      # `check_regress_facts.py`(拿 regress 的实测计数对拍)。这一步需要上一步
      # 落的 `tmp/regress-summary.json`。
      #
      # ⚠️ 它**不能**证明 FACTS.md 的数为真 —— 那要靠本 workflow 里真跑一遍
      # regress.py 再对拍(见上面的 regress step + Regression facts gate)。
      # 它证明的是「门能抓到这些已知的错误形态」。
      - name: Docs gate mutation test (prove the docs gate can see)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: docs-mutation
          python scripts/dev/test_docs_gate_mutations.py --regress-summary tmp/regress-summary.json

      # 规范一致性门(2026-10-30 加)。
      #
      # 为什么要有这道门:`Cap<T>` 的 8 字节 wire 布局在**两份锁定规范**
      # (lang-spec §2.6 / abi §2.5,`rights@5`)与**一份设计稿**
      # (binary-format §2,原 `rights@6`)里不一致,相差 1 字节 ——
      # **这个冲突活了三个月,就是因为没有一道门**。
      # 本门比对三处的 Cap 布局 + rights 位宽,并用 lang-spec 自带的构造示例
      # 做独立佐证(示例只能在一侧自洽 ⇒ 它是判对错的证据,不是装饰)。
      - name: Spec consistency gate (three specs must agree)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: spec-consistency
          python scripts/dev/check_spec_consistency.py

      - name: Binary format layout gate (.jhyynb struct sizes must be computable)
        # 2026-10-31 新增:binary-format 的每个 struct 尺寸是**手写**的,不是算出来的
        # ⇒ 人算错时没人知道。实测抓到三处真错:header 写 112B(实为 120B,且有 4B
        # 隐式 padding)、Debug Group Header 写 16B(实为 12B)、header_crc 的 CRC
        # 覆盖范围写错 ⇒ 规范照着实现的人会**二进制错位**而 CI 全绿。
        if: always()
        shell: msys2 {0}
        run: |
          # gate: binary-layout
          python scripts/dev/check_binary_format_layout.py

      - name: Architecture claims gate (architecture.md's structural claims vs source)
        # 2026-11-01 新增:`docs/internal/architecture.md` 满是可以**当场证伪**的断言
        # (模块清单、NodeKind 个数、「regalloc_init 被注释掉」、「rcache 默认关」、
        # 「peephole 4096 字节上限」…),但**没有任何门盯着它** ⇒ 源码一改文档就悄悄过期。
        # 实测抓到 13 条过期行数 ⇒ 行数已从文档里去掉(会变的数字不进设计文档),
        # 本门改盯不会每改一次源码就漂的结构性事实。
        if: always()
        shell: msys2 {0}
        run: |
          # gate: arch-claims
          python scripts/dev/check_arch_claims.py

      # ── 寄存器分配器的独立实现对拍(2026-11-03 加)────────────────────
      #
      # 为什么要有这道门:`scripts/dev/regalloc_reference.py` 是一份**独立写的**
      # Python 参考实现,存在的理由就是「两套独立写的算法给出同一个数,才说明
      # 这个数是对的」。但它**从来没被任何门跑过** ⇒ 它自己烂掉了也没人知道。
      # 实测:2026-11-03 第一次真跑它,两侧差 6 —— 差的是**浮点 temp**:
      # `s`/`d` 不能进 GPR 池,而**参考实现漏了「整数类型」这一维**
      # (它自己的 docstring 都写着有这一维)⇒ 编译器侧是对的、参考实现是错的。
      # ⇒ 这道门把「参考实现」从「一个躺在树里的工具」变成**有约束的东西**。
      #
      # ⚠️ 门内那一步编译器会**以失败告终** —— 那是 v4.4.0 阶段一的守卫
      # 「分配了寄存器却走槽位路径 ⇒ 响亮失败」,**设计如此**(阶段二 emit 层
      # 消费寄存器还没做)。本门不看退出码,只看**统计数字**。
      - name: 寄存器分配对拍(两套独立实现必须给出同一个数)
        if: always()
        shell: msys2 {0}
        run: |
          # gate: regalloc-parity
          python scripts/dev/check_regalloc_parity.py

  # ══════════════════════════════════════════════════════════════════════
  # 5 个 SysV ABI 测试 —— 此前在 CI 上**根本不存在门**
  # ══════════════════════════════════════════════════════════════════════
  #
  # `regress.py` 的 `--cross=auto` 在 windows-latest 上三个探测全失败
  # (没有可用的 WSL distro / docker 镜像 gcc:12 没有 windows-amd64 manifest),
  # 于是 cross_mode=none → 6 个 sysv 测试永远 SKIP,`_sysv_failed == 0`
  # 就算通过。CI 日志实证:`cross: --cross=auto → resolved=none`。
  #
  # 而 W-104(SysV caller 侧分类错)与 W-116(SysV callee 只 spill 4 个寄存器)
  # 都在待清零的 ACTIVE 名单里 —— **它们的门压根不存在**。
  #
  # ubuntu-latest 上这条路能通:没有 wsl.exe(wsl 分支自动跳过),
  # `_docker_daemon_up()` 会成功,gcc:12 在 linux/amd64 上有 manifest。
  # docker 分支(`regress.py:377-441`)的 Stage 1(Windows 侧编译)在 Linux 上
  # 本来就可用。`runtime/linux_elf/crt0.S` 与 `link.ld` 都已在仓里。
  sysv:
    # ⚠️ 2026-11-05:`name` 改成 job id(`sysv`)—— **required status check 用的是
    #   job 的显示名**,而它要当稳定 id 用(分支保护的 contexts 引用它)。
    #   显示名一改,分支保护里的 context 就不再上报 ⇒ 所有 PR 永久卡在
    #   "Expected — Waiting for status to be reported"。
    #   ⇒ 这道门是 **SysV ABI 门**:那 6 个 SysV ABI 测试 + W-104 跨实现对拍
    #   **在 windows-latest 上永远 SKIP** ⇒ 唯一能跑它们的 job 就是这个
    #   (ubuntu-latest)。绿灯不覆盖它们 ⇒ 别拿 windows-latest 的绿当全绿。
    name: sysv
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download .s emitted on the Windows runner
        uses: actions/download-artifact@v4
        with:
          name: sysv-il
          path: tmp/sysv_il

      - name: Download ABI cross-check .s
        uses: actions/download-artifact@v4
        with:
          name: sysv-abi
          path: tmp/sysv_abi

      - name: SysV ABI gate (link + run + compare // EXPECT:)
        run: |
          # gate: sysv-abi
          set -x
          uname -a
          gcc --version | head -1
          ls -la tmp/sysv_il/
            # 7 份一份都不能少(6 个 sysv 测试 + 1 个 ABI 对拍 caller)——
            # 少了就是上游 emit 步出了问题,不能当成通过。
            n=$(ls tmp/sysv_il/*.s 2>/dev/null | wc -l)
            echo "收到 $n 份 regress 用例 .s(期望 6)"
            [ "$n" -eq 6 ] || { echo "::error::.s 数量不对,拒绝报绿"; exit 1; }
            m=$(ls tmp/sysv_abi/*.s 2>/dev/null | wc -l)
            echo "收到 $m 份 ABI 对拍用 .s(期望 3:small caller / MEMORY caller / MEMORY callee)"
            [ "$m" -eq 3 ] || { echo "::error::ABI 对拍 .s 缺失,拒绝报绿"; exit 1; }
            bash compiler/tests/bootstrap/sysv_link_run.sh tmp/sysv_il

      # ⚠️ 2026-11-03:从上面那个 step 里**拆出来**。
      # 拆的理由同「工具链门 vs VSCode bash 门」:一个 step 只能承载**一道门**
      # (门清单里 id 一一对应)。W-104 跨实现对拍与 SysV ABI 用例是**两个判据**,
      # 挂在一起时清单里查不出它独立是什么。
      - name: SysV 跨实现 ABI 对拍 (jhyy ↔ gcc,W-104)
        run: |
          # gate: sysv-cross
          echo "### W-104 跨实现 ABI 对拍(jhyy ↔ gcc)"
          bash compiler/tests/bootstrap/sysv_abi_cross.sh tmp/sysv_abi

  # ══════════════════════════════════════════════════════════════════════
  # VSCode 扩展 —— grammar 自检(独立 job,不依赖编译器)
  # ══════════════════════════════════════════════════════════════════════
  #
  # 2026-10-30:此前 grammar **完全没有门**。`syntaxes/jhyy.tmLanguage.json`
  # 是**手写**的,很容易跟真实语言规则对不上(用户报过一批:漏关键字 /
  # 数字字面量规则不准 / 字符字面量不高亮),只能靠用户报 ⇒ 修完没有
  # 任何东西盯着它别再退回去。
  # `vscode-ext/scripts/check-grammar.mjs` 就是为此写的(把「语言真实规则 →
  # grammar 必须命中」钉成 30 条断言 + 4 条反例),但它**没接进 CI**
  # ⇒ 只在本地手动跑 = 装饰(per `feedback_ci_gate_must_exercise_path`:
  # opt-in 的门必须真接上,否则比没有门更糟)。
  #
  # **独立 job 而不是 build-and-test 里的一步**:纯 Node、零依赖、约 1 秒;
  # 放进那个 job 会让它排在最长 45 分钟的编译之后才报红。
  #
  # ⚠️ 这道门**造过红灯**(2026-10-30 变异测试):
  #   ① 往 numbers 规则数组**前面插一条**  → 仍绿(重排免疫)
  #   ② 重排 + 整数规则放回 `_` 分隔      → 红(旧版在此**空转变绿**)
  #   ③ 浮点规则放行指数写法               → 红
  #   ④ 前导零规则认 0-9                  → 红
  #   ⑤ 整数 scope 改成 oct               → 红
  vscode-ext:
    # ⚠️ 2026-11-05:`name` 改成 job id(`vscode-ext`)—— 理由同 `sysv` 那个:
    #   **required status check 用显示名** ⇒ 它要当稳定 id 用。
    #   这道门是 **VSCode 扩展的 grammar 自检**:扩展的 grammar 必须命中
    #   语言的真实规则(不是扩展自己那份副本)。
    name: vscode-ext
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grammar self-check (语言真实规则 → grammar 必须命中)
        working-directory: vscode-ext
        run: |
          # gate: vscode-grammar
          node scripts/check-grammar.mjs

  # ══════════════════════════════════════════════════════════════════════
  # 发布 —— 门不绿就发不出去
  # ══════════════════════════════════════════════════════════════════════
  #
  # 2026-10-18 之前,发布由 release.yml 的 `push: tags` 触发。那条路
  # **无法 needs: 别的 workflow**,所以门没过也能发布。实测后果:
  # v3.4.2 / v4.0.0-rc1 / v4.0.1 / v4.0.2 / v4.0.6 五次 tag push 全部失败,
  # 最后一个真实 release 停在 2026-09-08 的 v3.2.0 —— 而同期文档一直在写
  # "v4.0.0-rc1 shipped"。「文档说 shipped」与「有可安装产物」断了 6 周。
  #
  # 现在 release.yml 改成 reusable workflow(`on: workflow_call`),由本 job
  # 以 `needs: build-and-test` 调用 —— 这是 `needs:` 能跨文件生效的唯一途径,
  # 且零代码重复。
  # ⚠️ `sysv` **必须**在 needs 里(2026-11-03 审计补):
  # 那 6 个 SysV ABI 测试 + W-104 跨实现对拍在 windows-latest 上永远 SKIP
  # (`--cross=auto → resolved=none`)⇒ **唯一能跑它们的 job 是 sysv**。
  # 而此前 release 只 needs build-and-test + vscode-ext ⇒ SysV ABI 门红了
  # 照发不误 ⇒ 那道门对「能不能发版」毫无约束力(与「恒红且被忽略的步骤
  # 比没有门更糟」是同一类失效:门存在,但不影响结论)。
  release:
    name: Release installer
    needs: [build-and-test, vscode-ext, sysv]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # 创建 GitHub Release
      # ⚠️ 2026-11-05:**被调用的 reusable workflow 只能「降级」权限,不能提权**
      #   ⇒ 它请求的权限必须是这里的**子集**,否则 GitHub 报
      #   "Invalid workflow file" ⇒ **本 workflow 整个 run startup_failure**
      #   (连 ci.yml 自己的 job 都不会跑;actionlint / PyYAML 全绿也照样炸 ——
      #    它不是 YAML 问题,是权限模型问题)。
      #   release.yml 的门 `release-ci-green` 要用 GitHub API 查 tag 的 CI run
      #   ⇒ 需要 actions: read ⇒ 必须**在这里**(调用方)先给。
      actions: read     # release-ci-green 门查 CI run
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
