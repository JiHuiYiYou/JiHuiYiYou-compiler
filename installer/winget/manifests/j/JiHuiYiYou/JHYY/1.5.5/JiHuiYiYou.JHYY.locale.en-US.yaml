PackageVersion: 1.5.5
PackageLocale: en-US
Publisher: JiHuiYiYou
PackageName: JHYY Compiler
License: MIT
ShortDescription: JHYY (机会翼游) — statically-typed language + bootstrapping compiler for Windows
Description: |-
  JHYY (机会翼游) is a statically-typed programming language with a self-bootstrapping compiler.
  The compiler is written in JHYY itself (v1.0.0+ self-hosting closure achieved), targeting
  amd64 Windows via QBE IL. This installer bundles the jhyy.exe production binary, the
  vendored QBE backend, a VSCode extension (.vsix, auto-installed if `code` is on PATH),
  .jhyy file association, and Start Menu shortcuts (Documentation / Quick Start).

  Requires MSYS2 + ucrt64 GCC for the compile/link step (jhyy.exe produces QBE IL,
  which GCC then assembles and links). The installer Welcome page guides new users
  through installing MSYS2 first.

  Build instructions and source code: https://github.com/JiHuiYiYou/JiHuiYiYou-compiler
  Language spec: docs/abis/jhyy-lang-spec-v1.1.0.md
Moniker: jhyy
Tags:
  - compiler
  - programming-language
  - bootstrapping
  - statically-typed
